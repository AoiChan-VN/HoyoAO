<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không Tìm Thấy Trang</title>
  
  <!-- Hệ thống Stylesheet dùng chung để giữ nguyên giao diện -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Thanh Điều Hướng Hệ Thống (Data-Driven Render) -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="index.html" id="site-logo" class="site-logo">PURE</a>
      <nav class="main-navigation">
        <ul id="nav-list" class="nav-list">
          <!-- Sẽ được render tự động qua js/app.js -->
        </ul>
      </nav>
      <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <!-- Bảng Cấu Hình Hệ Thống (Settings Panel) -->
  <aside id="settings-panel" class="settings-panel hidden">
    <div class="settings-content">
      <h3>Cài Đặt Hệ Thống</h3>
      <div class="setting-group">
        <label for="theme-select">Giao diện:</label>
        <select id="theme-select"></select>
      </div>
      <div class="setting-group">
        <label for="gyro-switch" class="switch-label">
          <input type="checkbox" id="gyro-switch" checked>
          Sử dụng Cảm biến Nghiêng (Gyroscope)
        </label>
      </div>
    </div>
  </aside>

  <!-- Khung Chứa Phối Cảnh Parallax Báo Lỗi -->
  <main id="parallax-container" class="parallax-container">
    
    <!-- Lớp nền sao và núi kế thừa từ trang chủ -->
    <section id="layer-bg-stars" class="parallax-layer layer-bg"></section>
    <section id="layer-mg-mountains" class="parallax-layer layer-mg"></section>

    <!-- Khối Nội Dung Thông Báo Lỗi Kính Mờ -->
    <section id="layer-fg-content" class="parallax-layer layer-fg">
      <div class="hero-content">
        <h1 style="font-size: 5rem; color: var(--accent-color); margin-bottom: 0;">404</h1>
        <h2 style="font-size: 1.5rem; margin-bottom: var(--spacing-md);">Đường dẫn này không tồn tại</h2>
        <p>Hệ thống không thể tìm thấy trang bạn yêu cầu. Có thể liên kết đã bị hỏng hoặc trang đã bị gỡ bỏ.</p>
        
        <div class="cta-actions" style="margin-top: var(--spacing-lg);">
          <a href="index.html" class="btn btn-primary">Quay Về Trang Chủ</a>
        </div>
      </div>
    </section>

  </main>

  <!-- Khởi tạo Native ESM Modules để đồng bộ Theme và Menu ngay cả ở trang lỗi -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
