<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giới Thiệu - Pure Vanilla Experience</title>
  
  <!-- Kế thừa trọn vẹn hệ thống style và ma trận phối cảnh 3D -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Vùng chứa cấu phần Header tự động nạp bởi HeaderComponent (Sửa lỗi số 4) -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="index.html" id="site-logo" class="site-logo">PURE</a>
      <nav class="main-navigation">
        <ul id="nav-list" class="nav-list">
          <!-- Render tự động, giữ trạng thái class active theo trang hiện tại -->
        </ul>
      </nav>
      <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <!-- Vùng chứa cấu phần Bảng Cài Đặt tự động quản lý bởi SettingsComponent -->
  <aside id="settings-panel" class="settings-panel hidden">
    <div class="settings-content">
      <h3>Cài Đặt Hệ Thống</h3>
      <div class="setting-group">
        <label for="theme-select">Giao diện:</label>
        <select id="theme-select"></select>
      </div>
      <div class="setting-group">
        <label for="gyro-switch" class="switch-label">
          <input type="checkbox" id="gyro-switch" checked>
          Sử dụng Cảm biến Nghiêng (Gyroscope)
        </label>
      </div>
    </div>
  </aside>

  <!-- Khung Chứa Góc Nhìn Virtual 3D Camera Phối Cảnh -->
  <main id="parallax-container" class="parallax-container">
    
    <!-- Các Layer Parallax nạp ảnh nền động từ assets-manifest.json -->
    <section id="layer-bg-stars" class="parallax-layer layer-bg"></section>
    <section id="layer-mg-mountains" class="parallax-layer layer-mg"></section>

    <!-- Khối Tiền Cảnh Chứa Thông Tin Giới Thiệu (Thiết kế Kính mờ) -->
    <section id="layer-fg-content" class="parallax-layer layer-fg">
      <div class="hero-content">
        <h1 id="hero-title">Về Dự Án PURE</h1>
        <p id="hero-subtitle">Giải pháp kiến trúc Web Standards thuần khiết, tối ưu tuyệt đối cho môi trường GitHub Pages tĩnh.</p>
        
        <div class="cta-actions">
          <a href="index.html" class="btn btn-secondary">Quay Lại Trang Chủ</a>
          <a href="contact.html" class="btn btn-primary">Liên Hệ Ngay</a>
        </div>

        <!-- Khối chứa danh sách Card bài viết riêng biệt sẽ được ArticleCardComponent tự động chèn vào đây -->
      </div>
    </section>

  </main>

  <!-- Khởi tạo Native ESM Modules Điều Phối Toàn Ứng Dụng -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
