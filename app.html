<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Aoi Library</title>

    <meta
        name="description"
        content="Personal Knowledge Base Application"
    >

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            script-src 'self';
            style-src 'self';
            img-src 'self' https: data:;
            connect-src 'self';
            font-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'none';
            upgrade-insecure-requests;
        "
    >

    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="dark">

    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/variables.css">
    <link rel="stylesheet" href="./assets/css/app.css">
</head>

<body>

<div id="application" class="application">

    <header class="application-header">

        <div class="application-header__brand">
            <h1>Aoi Library</h1>
        </div>

        <div class="application-header__search">

            <label
                for="globalSearch"
                class="sr-only"
            >
                Search
            </label>

            <input
                id="globalSearch"
                type="search"
                placeholder="Search..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>

    </header>

    <div class="application-layout">

        <aside
            class="sidebar"
            aria-label="Sidebar"
        >

            <section class="sidebar-section">

                <h2>Categories</h2>

                <ul
                    id="categoryList"
                    class="sidebar-list"
                ></ul>

            </section>

            <section class="sidebar-section">

                <h2>Tags</h2>

                <ul
                    id="tagList"
                    class="sidebar-list"
                ></ul>

            </section>

            <section class="sidebar-section">

                <h2>Articles</h2>

                <div
                    id="articleCards"
                    class="article-cards"
                ></div>

            </section>

        </aside>

        <main
            id="viewer"
            class="viewer"
            aria-label="Markdown Viewer"
        >

            <article
                id="viewerContent"
                class="viewer-content"
            >

                <h1>Welcome</h1>

                <p>
                    Select an article from the sidebar.
                </p>

            </article>

        </main>

    </div>

</div>

<script type="module">

    const viewerContent =
        document.getElementById("viewerContent");

    const categoryList =
        document.getElementById("categoryList");

    const tagList =
        document.getElementById("tagList");

    const articleCards =
        document.getElementById("articleCards");

    const searchInput =
        document.getElementById("globalSearch");

    const bootstrapData = {
        categories: [],
        tags: [],
        posts: []
    };

    function createEmptyState() {
        viewerContent.innerHTML = `
            <h1>Knowledge Base</h1>
            <p>
                Runtime modules will initialize here.
            </p>
        `;
    }

    function renderCategories() {

        categoryList.replaceChildren();

        for (const category of bootstrapData.categories) {

            const li =
                document.createElement("li");

            li.textContent = category;

            categoryList.append(li);
        }
    }

    function renderTags() {

        tagList.replaceChildren();

        for (const tag of bootstrapData.tags) {

            const li =
                document.createElement("li");

            li.textContent = tag;

            tagList.append(li);
        }
    }

    function renderCards() {

        articleCards.replaceChildren();

        for (const post of bootstrapData.posts) {

            const card =
                document.createElement("button");

            card.type = "button";
            card.className = "article-card";
            card.textContent = post.title;

            articleCards.append(card);
        }
    }

    function initializeApplication() {

        createEmptyState();
        renderCategories();
        renderTags();
        renderCards();

        searchInput.addEventListener(
            "input",
            () => {},
            { passive: true }
        );
    }

    initializeApplication();

</script>

</body>
</html>
