<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ - Pure Vanilla Experience</title>
  
  <!-- Kế thừa hệ thống style toàn cục và ma trận phối cảnh VR 3D mới -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Thanh Điều Hướng Hệ Thống Multi-Page (Quản lý tự động qua header.js) -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="index.html" id="site-logo" class="site-logo">PURE</a>
      <nav class="main-navigation">
        <ul id="nav-list" class="nav-list">
          <!-- Render tự động và giữ trạng thái active theo trang -->
        </ul>
      </nav>
      <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <!-- Bảng Cấu Hình Hệ Thống Đồng Bộ Xuyên Trang (Quản lý qua settings.js) -->
  <aside id="settings-panel" class="settings-panel hidden">
    <div class="settings-content">
      <h3>Cài Đặt Hệ Thống</h3>
      <div class="setting-group">
        <label for="theme-select">Giao diện:</label>
        <select id="theme-select"></select>
      </div>
      <div class="setting-group">
        <label for="gyro-switch" class="switch-label">
          <input type="checkbox" id="gyro-switch" checked>
          Sử dụng Cảm biến Nghiêng (Gyroscope)
        </label>
      </div>
    </div>
  </aside>

  <!-- Khung Chứa Góc Nhìn Phối Cảnh Mắt Người (Perspective Box) -->
  <main id="parallax-container" class="parallax-container">
    
    <!-- Sân Khấu Lập Thể VR Thực Thụ (Đồng bộ cấu trúc ma trận chuyển động) -->
    <div class="vr-stage">
      
      <!-- Layer 1: Hậu cảnh nền trời sao nội bộ (Trục Z: -400px) -->
      <section id="layer-bg-stars" class="parallax-layer layer-bg"></section>

      <!-- Layer 2: Trung cảnh dãy núi nội bộ (Trục Z: -200px) -->
      <section id="layer-mg-mountains" class="parallax-layer layer-mg"></section>

      <!-- Layer 3: Tiền cảnh chứa khối biểu mẫu liên hệ kính mờ (Trục Z: 0px) -->
      <section id="layer-fg-content" class="parallax-layer layer-fg">
        <article class="hero-content">
          <h1>Liên Hệ</h1>
          <p style="margin-bottom: var(--spacing-sm);">Gửi thông điệp của bạn đến dự án PURE</p>
          
          <!-- Biểu mẫu liên hệ tối giản diện tích, nhường chỗ cho không gian VR (Sửa lỗi che khuất) -->
          <form id="contact-form" action="#" method="POST" style="display: flex; flex-direction: column; gap: var(--spacing-sm); text-align: left; width: 100%;">
            
            <div class="setting-group" style="margin-bottom: 0;">
              <label for="contact-name" style="font-size: 0.8rem; margin-bottom: 2px;">Họ và tên:</label>
              <input type="text" id="contact-name" name="name" required style="width: 100%; padding: var(--spacing-xs) var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; font-size: 0.85rem;">
            </div>

            <div class="setting-group" style="margin-bottom: 0;">
              <label for="contact-email" style="font-size: 0.8rem; margin-bottom: 2px;">Email:</label>
              <input type="email" id="contact-email" name="email" required style="width: 100%; padding: var(--spacing-xs) var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; font-size: 0.85rem;">
            </div>

            <div class="setting-group" style="margin-bottom: 0;">
              <label for="contact-message" style="font-size: 0.8rem; margin-bottom: 2px;">Nội dung:</label>
              <textarea id="contact-message" name="message" rows="3" required style="width: 100%; padding: var(--spacing-xs) var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; resize: none; font-size: 0.85rem;"></textarea>
            </div>

            <div class="cta-actions" style="margin-top: var(--spacing-sm); margin-bottom: 0; gap: var(--spacing-sm);">
              <a href="index.html" class="btn btn-secondary" style="padding: var(--spacing-xs) var(--spacing-md); font-size: 0.85rem;">Trang Chủ</a>
              <button type="submit" class="btn btn-primary" style="flex-grow: 1; padding: var(--spacing-xs) var(--spacing-md); font-size: 0.85rem;">Gửi Đi</button>
            </div>
          </form>
        </article>
      </section>

    </div>
  </main>

  <!-- Khởi tạo Native ESM Modules Điều Phối Toàn Ứng Dụng -->
  <script type="module" src="js/app.js"></script>
  
  <script type="module">
    // Thực thi xử lý nghiệp vụ gửi form tĩnh thực tế (Business Logic)
    document.getElementById('contact-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Hệ thống PURE đã ghi nhận thông điệp liên hệ thành công!');
    });
  </script>
</body>
</html>
