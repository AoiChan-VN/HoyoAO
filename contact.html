<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ - Pure Vanilla Experience</title>
  
  <!-- Hệ thống Stylesheet CSS4+ dùng chung -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Thanh Điều Hướng (Data-Driven Render tự động gán class active cho trang Contact) -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="#" id="site-logo" class="site-logo">PURE</a>
      <nav class="main-navigation">
        <ul id="nav-list" class="nav-list">
          <!-- Item điều hướng sẽ được render tự động từ config.js -->
        </ul>
      </nav>
      <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <!-- Bảng Cấu Hình Hệ Thống (Settings Panel) -->
  <aside id="settings-panel" class="settings-panel hidden">
    <div class="settings-content">
      <h3>Cài Đặt Hệ Thống</h3>
      
      <!-- Lựa chọn Giao diện (Theme Selector) -->
      <div class="setting-group">
        <label for="theme-select">Giao diện:</label>
        <select id="theme-select">
          <!-- Các option theme sẽ được render từ config.js -->
        </select>
      </div>

      <!-- Bật/Tắt Con Quay Hồi Chuyển (Gyroscope cho Mobile) -->
      <div class="setting-group">
        <label for="gyro-switch" class="switch-label">
          <input type="checkbox" id="gyro-switch" checked>
          Sử dụng Cảm biến Nghiêng (Gyroscope)
        </label>
      </div>
    </div>
  </aside>

  <!-- Khung Chứa Góc Nhìn Virtual Camera & Nội Dung Liên Hệ -->
  <main id="parallax-container" class="parallax-container">
    
    <!-- Layer 1: Các Ngôi Sao (Nền xa) -->
    <section id="layer-bg-stars" class="parallax-layer layer-bg">
      <div class="stars-generator"></div>
    </section>

    <!-- Layer 2: Khối Biểu Mẫu Liên Hệ (Tầm gần - Thiết kế Kính mờ Glassmorphism) -->
    <section id="layer-fg-content" class="parallax-layer layer-fg">
      <div class="hero-content" style="max-width: 550px; text-align: left;">
        <h1 id="hero-title" style="text-align: center; margin-bottom: var(--spacing-sm);">Liên Hệ</h1>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: var(--spacing-lg);">Gửi thông điệp của bạn đến với chúng tôi</p>
        
        <!-- Biểu mẫu liên hệ thuần (Data-Driven styling tương thích hoàn toàn) -->
        <form id="contact-form" onsubmit="event.preventDefault(); alert('Tin nhắn đã được giả lập gửi thành công (Business Logic)!');" style="display: flex; flex-direction: column; gap: var(--spacing-md);">
          
          <div class="setting-group" style="margin-bottom: 0;">
            <label for="contact-name">Họ và tên:</label>
            <input type="text" id="contact-name" required style="width: 100%; padding: var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none;">
          </div>

          <div class="setting-group" style="margin-bottom: 0;">
            <label for="contact-email">Email liên hệ:</label>
            <input type="email" id="contact-email" required style="width: 100%; padding: var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none;">
          </div>

          <div class="setting-group" style="margin-bottom: 0;">
            <label for="contact-message">Nội dung thông điệp:</label>
            <textarea id="contact-message" rows="4" required style="width: 100%; padding: var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; resize: none;"></textarea>
          </div>

          <div class="cta-actions" style="margin-top: var(--spacing-md);">
            <a href="index.html" class="btn btn-secondary">Trang Chủ</a>
            <button type="submit" class="btn btn-primary" style="flex-grow: 1;">Gửi Tin Nhắn</button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <!-- Khởi tạo Native ESM Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
