<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ - Pure Vanilla Experience</title>
  
  <!-- 1. Hệ thống Style cốt lõi và Biến số màu sắc CSS4+ -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">

  <!-- 2. Hệ thống Stylesheet mô-đun hóa phân rã độc lập -->
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/article-card.css">

  <!-- 3. Bộ lọc Responsive bóp gọn UI và chống lệch trục hở ảnh nền trên Mobile -->
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Thanh Điều Hướng Hệ Thống Multi-Page (Quản lý tự động qua header.js) -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="index.html" id="site-logo" class="site-logo">PURE</a>
      <nav class="main-navigation">
        <ul id="nav-list" class="nav-list">
          <!-- Render tự động và giữ trạng thái active theo trang -->
        </ul>
      </nav>
      <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <!-- Bảng Cấu Hình Hệ Thống Đồng Bộ Xuyên Trang (Nạp động qua settings.js) -->
  <aside id="settings-panel" class="settings-panel hidden">
    <!-- Cấu trúc các nhóm chức năng Slider, Ngôn ngữ, Ẩn UI sẽ được tự động chèn vào đây -->
  </aside>

  <!-- Khung Chứa Góc Nhìn Phối Cảnh Mắt Người (Perspective Box) -->
  <main id="parallax-container" class="parallax-container">
    
    <!-- Sân Khấu Lập Thể VR Quay 360 Độ (Khóa chặt tâm ma trận đồng tâm) -->
    <div class="vr-stage">
      
      <!-- Layer 1: Hậu cảnh nền trời sao nội bộ (Trục Z: -300px, Overscan 1.6x trên Mobile) -->
      <section id="layer-bg-stars" class="parallax-layer layer-bg"></section>

      <!-- Layer 2: Trung cảnh dãy núi nội bộ (Trục Z: -150px, Overscan 1.3x trên Mobile) -->
      <section id="layer-mg-mountains" class="parallax-layer layer-mg"></section>

      <!-- Layer 3: Tiền cảnh chứa khối biểu mẫu liên hệ kính mờ (Trục Z: 0px) -->
      <section id="layer-fg-content" class="parallax-layer layer-fg">
        <article class="hero-content" style="max-width: 450px;">
          <h1>Liên Hệ</h1>
          <p style="margin-bottom: var(--spacing-sm); font-size: 0.8rem; opacity: 0.8;">Gửi thông điệp của bạn trực tiếp đến với dự án PURE</p>
          
          <!-- Biểu mẫu liên hệ độc lập (Nội dung bài viết .md từ trang About tuyệt đối không bị tràn sang đây) -->
          <form id="contact-form" action="#" method="POST" style="display: flex; flex-direction: column; gap: var(--spacing-sm); text-align: left; width: 100%;">
            
            <div class="setting-group" style="margin-bottom: 0;">
              <label for="contact-name" style="font-size: 0.75rem; margin-bottom: 2px; font-weight: 600;">Họ và tên:</label>
              <input type="text" id="contact-name" name="name" required style="width: 100%; padding: var(--spacing-xs) var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; font-size: 0.8rem;">
            </div>

            <div class="setting-group" style="margin-bottom: 0;">
              <label for="contact-email" style="font-size: 0.75rem; margin-bottom: 2px; font-weight: 600;">Email liên hệ:</label>
              <input type="email" id="contact-email" name="email" required style="width: 100%; padding: var(--spacing-xs) var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; font-size: 0.8rem;">
            </div>

            <div class="setting-group" style="margin-bottom: 0;">
              <label for="contact-message" style="font-size: 0.75rem; margin-bottom: 2px; font-weight: 600;">Nội dung thông điệp:</label>
              <textarea id="contact-message" name="message" rows="3" required style="width: 100%; padding: var(--spacing-xs) var(--spacing-sm); background-color: var(--bg-secondary); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: var(--radius-sm); outline: none; resize: none; font-size: 0.8rem;"></textarea>
            </div>

            <div class="cta-actions" style="margin-top: var(--spacing-sm); margin-bottom: var(--spacing-md); gap: var(--spacing-sm);">
              <a href="index.html" class="btn btn-secondary" style="padding: var(--spacing-xs) var(--spacing-md); font-size: 0.8rem;">Trang Chủ</a>
              <button type="submit" class="btn btn-primary" style="flex-grow: 1; padding: var(--spacing-xs) var(--spacing-md); font-size: 0.8rem;">Gửi Thông Điệp</button>
            </div>
          </form>

          <!-- 4. KHỐI CHÂN TRANG BẢN QUYỀN (Sửa lỗi thiếu thông tin bản quyền theo yêu cầu) -->
          <footer class="site-footer" style="border-top: 1px solid var(--border-glass); padding-top: var(--spacing-sm); width: 100%; text-align: center;">
            <p style="font-size: 0.65rem; color: var(--text-muted); margin-bottom: 0;">
              &copy; 2026 PURE Experience Project. Mọi quyền được bảo lưu. <br/>
              Powered by Native Web Standards.
            </p>
          </footer>
        </article>
      </section>

    </div>
  </main>

  <!-- Khởi tạo Native ESM Modules Điều Phối Toàn Ứng Dụng -->
  <script type="module" src="js/app.js"></script>
  
  <script type="module">
    // Thực thi xử lý nghiệp vụ gửi form tĩnh thực tế (Business Logic)
    document.getElementById('contact-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Hệ thống PURE đã ghi nhận thông điệp liên hệ thành công!');
    });
  </script>
</body>
</html>
