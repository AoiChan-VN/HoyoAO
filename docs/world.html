<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole — Relativistic Simulation</title>
<style>
  @import url('https://cdn.jsdelivr.net/fontsource/fonts/orbitron@latest/latin-500-normal.min.css');
  @import url('https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.min.css');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;cursor:crosshair}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;top:18px;left:18px;z-index:10;width:288px;background:rgba(8,8,16,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .4s}
  #ui.hidden{transform:translateX(-330px);opacity:0;pointer-events:none}
  #ui h1{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:3px;background:linear-gradient(90deg,#ff7a18,#ffd27a,#ff7a18);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:10.5px;color:rgba(255,255,255,.34);letter-spacing:1.4px;margin:3px 0 18px;text-transform:uppercase}
  .cg{margin-bottom:13px}
  .cg label{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
  .cg label span{color:#ffce73;font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.1);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffae3a 45%,#ff5e00);cursor:pointer;box-shadow:0 0 9px rgba(255,140,0,.6)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffae3a 45%,#ff5e00);cursor:pointer;box-shadow:0 0 9px rgba(255,140,0,.6)}
  .stats{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:rgba(255,255,255,.4);line-height:1.95}
  .stats div{display:flex;justify-content:space-between}
  .stats .v{color:#ffce73;font-variant-numeric:tabular-nums}
  #tog{position:fixed;top:18px;left:18px;z-index:11;width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
  #tog:hover{background:rgba(255,255,255,.16)}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.22);pointer-events:none;animation:p 5s ease-in-out infinite;text-align:center}
  @keyframes p{0%,100%{opacity:.18}50%{opacity:.5}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <h1>SINGULARITY</h1>
  <div class="sub">General-Relativistic Visualizer</div>

  <div class="cg"><label>Mass <span id="vMass">8.0 M☉</span></label><input id="sMass" type="range" min="3" max="30" step="0.5" value="8"></div>
  <div class="cg"><label>Spin (a/M) <span id="vSpin">0.60</span></label><input id="sSpin" type="range" min="0" max="0.998" step="0.002" value="0.6"></div>
  <div class="cg"><label>Inclination <span id="vIncl">78°</span></label><input id="sIncl" type="range" min="8" max="90" step="1" value="78"></div>
  <div class="cg"><label>Accretion Rate <span id="vAcc">85%</span></label><input id="sAcc" type="range" min="5" max="100" step="1" value="85"></div>
  <div class="cg"><label>Lensing <span id="vLens">1.00</span></label><input id="sLens" type="range" min="0" max="1.6" step="0.01" value="1"></div>
  <div class="cg"><label>Bloom <span id="vBloom">1.00</span></label><input id="sBloom" type="range" min="0" max="1.6" step="0.01" value="1"></div>
  <div class="cg"><label>Star Field <span id="vStar">340</span></label><input id="sStar" type="range" min="60" max="700" step="10" value="340"></div>

  <div class="stats">
    <div>Schwarzschild R<sub>s</sub><span class="v" id="oRs">—</span></div>
    <div>ISCO (prograde)<span class="v" id="oIsco">—</span></div>
    <div>Photon Orbit<span class="v" id="oPh">—</span></div>
    <div>Shadow Diameter<span class="v" id="oSh">—</span></div>
    <div>Hawking Temp<span class="v" id="oT">—</span></div>
    <div>Particles<span class="v" id="oP">—</span></div>
    <div>Frame Rate<span class="v" id="oFps">—</span></div>
  </div>
</div>
<button id="tog">☰</button>
<div class="hint">drag-look with mouse · scroll to zoom · double-click panel to hide</div>

<script>
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W=0,H=0;
function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; buildStars(); }
addEventListener('resize',resize);

/* ---------- blackbody-ish palette ---------- */
const PAL=[[0,26,6,4],[0.10,108,24,8],[0.22,188,62,16],[0.38,240,128,42],[0.52,255,190,96],[0.66,255,228,165],[0.80,255,248,232],[0.90,214,232,255],[1.0,168,198,255],[1.3,118,156,255]];
function palette(t){
  t=t<0?0:t>1.3?1.3:t;
  for(let i=0;i<PAL.length-1;i++){
    if(t<=PAL[i+1][0]){const a=PAL[i],b=PAL[i+1],f=(t-a[0])/(b[0]-a[0]);
      return [a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0,a[3]+(b[3]-a[3])*f|0];}
  }
  const l=PAL[PAL.length-1];return [l[1],l[2],l[3]];
}

/* ---------- parameters ---------- */
const P={mass:8,spin:0.6,incl:78,acc:85,lens:1,bloom:1,stars:340};
const $=id=>document.getElementById(id);
function readUI(){
  P.mass=+$('sMass').value; P.spin=+$('sSpin').value; P.incl=+$('sIncl').value;
  P.acc=+$('sAcc').value; P.lens=+$('sLens').value; P.bloom=+$('sBloom').value;
  const ns=+$('sStar').value;
  $('vMass').textContent=P.mass.toFixed(1)+' M☉';
  $('vSpin').textContent=P.spin.toFixed(3);
  $('vIncl').textContent=P.incl+'°';
  $('vAcc').textContent=P.acc+'%';
  $('vLens').textContent=P.lens.toFixed(2);
  $('vBloom').textContent=P.bloom.toFixed(2);
  $('vStar').textContent=ns;
  if(ns!==P.stars){P.stars=ns;buildStars();}
  // physics readouts
  const a=P.spin;
  const z1=1+Math.cbrt(1-a*a)*(Math.cbrt(1+a)+Math.cbrt(1-a));
  const z2=Math.sqrt(3*a*a+z1*z1);
  const iscoM=3+z2-Math.sqrt(Math.max(0,(3-z1)*(3+z1+2*z2)));
  const phM=2*(1+Math.cos(2/3*Math.acos(-a)));
  const km=1.477*P.mass;
  $('oRs').textContent=(2*km).toFixed(1)+' km';
  $('oIsco').textContent=(iscoM*km).toFixed(1)+' km';
  $('oPh').textContent=(phM*km).toFixed(1)+' km';
  $('oSh').textContent=((5.2-0.7*a)*km).toFixed(0)+' km';
  $('oT').textContent=(6.17e-8/P.mass).toExponential(1)+' K';
}
['sMass','sSpin','sIncl','sAcc','sLens','sBloom','sStar'].forEach(id=>$(id).addEventListener('input',readUI));

/* ---------- UI hide ---------- */
const ui=$('ui'),tog=$('tog');
tog.onclick=()=>{ui.classList.remove('hidden');tog.style.display='none';};
ui.ondblclick=()=>{ui.classList.add('hidden');tog.style.display='flex';};

/* ---------- interaction ---------- */
let mx=W/2,my=H/2,tx=W/2,ty=H/2,zoom=1,tzoom=1;
addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;});
addEventListener('wheel',e=>{tzoom=Math.max(.45,Math.min(2.6,tzoom-e.deltaY*.0012));},{passive:true});

/* ---------- stars ---------- */
let stars=[];
const STARCOL=['#ffffff','#cfe0ff','#ffe6c2','#ffd0c0','#d6ffe9'];
function buildStars(){
  stars=[];
  for(let i=0;i<P.stars;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.25,
      b:Math.random()*.7+.3,ts:Math.random()*3+1,to:Math.random()*6.28,
      col:STARCOL[Math.random()*5|0]});
  }
}

/* ---------- disk particles ---------- */
const NPART=1100;
const parts=[];
for(let i=0;i<NPART;i++){
  parts.push({a:Math.random()*6.2832, rf:1.25+Math.pow(Math.random(),.62)*3.95,
    seed:Math.random(), sz:Math.random()*.8+.6});
}

/* ---------- bloom offscreens ---------- */
const bA=document.createElement('canvas'),bB=document.createElement('canvas');
const bAx=bA.getContext('2d'),bBx=bB.getContext('2d');

/* ---------- globals per frame ---------- */
let cx,cy,SR,rIn,rOut,tiltY,haloFade,accF,time=0;

function drawStars(){
  const ER=SR*1.55, lensZone=SR*7;
  for(const s of stars){
    const dx=s.x-cx, dy=s.y-cy, d=Math.hypot(dx,dy);
    const tw=.55+.45*Math.sin(time*s.ts+s.to);
    if(d<lensZone && d>SR*1.02){
      const def=ER*ER/(d+1);
      const ad=d+def*.45;
      const ang=Math.atan2(dy,dx);
      const sx=cx+Math.cos(ang)*ad, sy=cy+Math.sin(ang)*ad;
      const stretch=1+2.4*(ER/(d+8))**2;
      const mag=Math.min(3,1+(ER/(d+6))**2);
      ctx.save();ctx.translate(sx,sy);ctx.rotate(ang);
      ctx.scale(1/Math.sqrt(stretch),stretch);
      ctx.globalAlpha=Math.min(1,s.b*tw*mag*.8);
      ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(0,0,s.r,0,6.2832);ctx.fill();
      ctx.restore();
    } else if(d>SR*1.02){
      ctx.globalAlpha=s.b*tw;ctx.fillStyle=s.col;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.2832);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

function smoothDiskLayer(layer){
  const betaA=.35+.32*P.spin;
  const sides=[['L',1+betaA],['R',1-betaA]];
  const ov=4/Math.max(.05,tiltY);
  for(const [side,shift] of sides){
    const beam=Math.pow(Math.max(.2,shift),2.2);
    ctx.save();
    ctx.translate(cx,cy);ctx.scale(1,tiltY);
    ctx.beginPath();
    if(layer==='far') ctx.rect(-W,-H,2*W,H+ov); else ctx.rect(-W,-ov,2*W,H+ov);
    ctx.clip();
    ctx.beginPath();
    if(side==='L') ctx.rect(-W,-H,W+3,2*H); else ctx.rect(-3,-H,W+3,2*H);
    ctx.clip();
    const g=ctx.createRadialGradient(0,0,rIn,0,0,rOut);
    for(let k=0;k<=10;k++){
      const f=k/10, r=rIn+f*(rOut-rIn);
      const T=Math.min(1,Math.pow(rIn/r,1.0));
      const c=palette(Math.min(1.3,T*shift));
      const al=Math.min(1,(.18+.82*T)*beam*accF*(layer==='far'?.82:1)*.95);
      g.addColorStop(f,`rgba(${c[0]},${c[1]},${c[2]},${al})`);
    }
    ctx.beginPath();ctx.arc(0,0,rOut,0,6.2832);ctx.arc(0,0,rIn,0,6.2832,true);
    ctx.fillStyle=g;ctx.fill('evenodd');
    ctx.restore();
  }
}

function smoothHalo(){
  if(haloFade<.01) return;
  const li=SR*1.02, lo=SR*1.62, betaA=.35+.32*P.spin;
  const sides=[1+betaA,1-betaA];
  for(let si=0;si<2;si++){
    const shift=sides[si], beam=Math.pow(Math.max(.2,shift),2.0);
    ctx.save();
    ctx.beginPath();
    if(si===0) ctx.rect(cx-W,cy-H,W+3,2*H); else ctx.rect(cx-3,cy-H,W+3,2*H);
    ctx.clip();
    const g=ctx.createRadialGradient(cx,cy,li,cx,cy,lo);
    for(let k=0;k<=10;k++){
      const f=k/10, rf=1.25+f*3.95;
      const T=Math.min(1,Math.pow(1.25/rf,1.0));
      const c=palette(Math.min(1.3,T*shift));
      const al=Math.min(1,(.12+.62*T)*beam*accF*haloFade*.78);
      g.addColorStop(Math.sqrt(f),`rgba(${c[0]},${c[1]},${c[2]},${al})`);
    }
    ctx.beginPath();ctx.arc(cx,cy,lo,0,6.2832);ctx.arc(cx,cy,li,0,6.2832,true);
    ctx.fillStyle=g;ctx.fill('evenodd');
    ctx.restore();
  }
}

function pColor(p,mode){
  const a=p.a, rf=p.rf, ur=(rf-1.25)/3.95;
  const T=Math.min(1,Math.pow(1.25/rf,1.0));
  const beta=Math.min(.85,.55*Math.sqrt(1.25/rf)*(.5+.6*P.spin));
  const shift=Math.max(.2,1-beta*Math.cos(a));
  const Teff=Math.min(1.3,T*shift);
  const beam=Math.pow(shift,3);
  const turb=.45+.55*(.5+.5*Math.sin(a*4+p.seed*6.283+rf*2+time*.9))*
                   (.55+.45*Math.sin(a*2-Math.log(rf+.5)*2.2+time*.5+p.seed*3));
  const em=beam*turb*(.3+.7*T)*accF;
  const c=palette(Teff);
  let al=em*(mode==='lensed'?.5*haloFade:.62);
  al=al>1?1:al;
  const sz=(.5+(1-ur)*1.3)*zoom*(.6+.7*turb)*(mode==='lensed'?.8:1)*p.sz;
  return {c,al,sz};
}

function drawParticles(layer){
  for(const p of parts){
    const isFar=Math.sin(p.a)>.04;
    if(layer==='far'&&!isFar) continue;
    if(layer==='near'&&isFar) continue;
    const r=p.rf*SR;
    const x=cx+Math.cos(p.a)*r, y=cy-Math.sin(p.a)*r*tiltY;
    const {c,al,sz}=pColor(p,'d');
    if(al<.02) continue;
    ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${al})`;
    ctx.beginPath();ctx.arc(x,y,Math.max(.4,sz),0,6.2832);ctx.fill();
  }
}
function drawParticlesLensed(){
  if(haloFade<.02) return;
  for(const p of parts){
    const ur=(p.rf-1.25)/3.95;
    const Rl=SR*(1.02+.6*Math.sqrt(ur<0?0:ur>1?1:ur));
    const x=cx+Math.cos(p.a)*Rl, y=cy-Math.sin(p.a)*Rl;
    const {c,al,sz}=pColor(p,'l');
    if(al<.02) continue;
    ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${al})`;
    ctx.beginPath();ctx.arc(x,y,Math.max(.4,sz),0,6.2832);ctx.fill();
  }
}

function drawShadow(){
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,SR*1.03);
  g.addColorStop(0,'#000');g.addColorStop(.92,'#000');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,SR*1.03,0,6.2832);ctx.fill();
}
function drawShadowCore(){
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,SR*.985,0,6.2832);ctx.fill();
}
function drawPhotonGlow(){
  ctx.lineWidth=4*zoom;ctx.strokeStyle='rgba(255,180,110,.35)';
  ctx.beginPath();ctx.arc(cx,cy,SR*1.02,0,6.2832);ctx.stroke();
  ctx.lineWidth=2*zoom;ctx.strokeStyle='rgba(255,220,160,.7)';
  ctx.beginPath();ctx.arc(cx,cy,SR*1.0,0,6.2832);ctx.stroke();
}
function drawPhotonSharp(){
  ctx.lineWidth=1.4*zoom;ctx.strokeStyle='rgba(255,238,210,.95)';
  ctx.beginPath();ctx.arc(cx,cy,SR*1.0,0,6.2832);ctx.stroke();
  ctx.lineWidth=.8*zoom;ctx.strokeStyle='rgba(255,255,255,.6)';
  ctx.beginPath();ctx.arc(cx,cy,SR*.995,0,6.2832);ctx.stroke();
}

function drawJets(){
  const jstr=P.spin*accF;
  if(jstr<.05) return;
  const len=SR*6.5;
  for(const dir of [-1,1]){
    for(let i=0;i<44;i++){
      const t=i/44;
      const sp=Math.sin(i*12.9+dir*5)*SR*.13*t;
      const wob=Math.sin(time*2.2+t*9+dir)*SR*.05*t;
      const x=cx+sp+wob;
      const y=cy+dir*(SR*.55+t*len);
      const a=(1-t)*jstr*.55*(.55+.45*Math.sin(i*3+time*5));
      if(a<.01) continue;
      const sz=(1-t*.7)*SR*.07*(.6+.4*Math.abs(Math.sin(i*7)));
      const g=ctx.createRadialGradient(x,y,0,x,y,sz*3);
      g.addColorStop(0,`rgba(210,228,255,${a})`);
      g.addColorStop(.5,`rgba(110,150,255,${a*.4})`);
      g.addColorStop(1,'rgba(60,90,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,sz*3,0,6.2832);ctx.fill();
    }
    const pg=ctx.createRadialGradient(cx,cy+dir*SR*.6,0,cx,cy+dir*SR*.6,SR*.5);
    pg.addColorStop(0,`rgba(220,235,255,${jstr*.5})`);
    pg.addColorStop(1,'rgba(120,160,255,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(cx,cy+dir*SR*.6,SR*.5,0,6.2832);ctx.fill();
  }
}

function applyBloom(){
  if(P.bloom<.01) return;
  bA.width=W>>1;bA.height=H>>1;bAx.drawImage(cv,0,0,bA.width,bA.height);
  bB.width=W>>2;bB.height=H>>2;bBx.drawImage(cv,0,0,bB.width,bB.height);
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.filter='blur(6px)';ctx.globalAlpha=.55*P.bloom;ctx.drawImage(bA,0,0,W,H);
  ctx.filter='blur(20px)';ctx.globalAlpha=.42*P.bloom;ctx.drawImage(bB,0,0,W,H);
  ctx.restore();ctx.filter='none';ctx.globalAlpha=1;
}

function vignette(){
  const g=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.35,cx,cy,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* ---------- main loop ---------- */
let last=performance.now(),fps=60,fc=0,fpsT=last;
function frame(now){
  const dt=Math.min(3,(now-last)/16.667);last=now;time+=.016*dt;
  fc++; if(now-fpsT>500){fps=Math.round(fc*1000/(now-fpsT));fc=0;fpsT=now;$('oFps').textContent=fps;}

  mx+=(tx-mx)*.05*dt; my+=(ty-my)*.05*dt; zoom+=(tzoom-zoom)*.06*dt;
  cx=W/2+(mx-W/2)*.06; cy=H/2+(my-H/2)*.06;

  SR=(48+P.mass*2.4)*zoom;
  rIn=SR*1.25; rOut=SR*5.2;
  const ir=P.incl*Math.PI/180;
  tiltY=Math.cos(ir);
  haloFade=Math.pow(Math.max(0,Math.sin(ir)),1.3)*P.lens;
  accF=P.acc/100;

  // advance orbits
  for(const p of parts){ p.a+=.016*dt*.95*Math.sqrt(1.25/p.rf)*(1+.4*P.spin); if(p.a>6.2832)p.a-=6.2832; }

  // background
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter='none';
  ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
  let ng=ctx.createRadialGradient(W*.32,H*.4,0,W*.32,H*.4,W*.6);
  ng.addColorStop(0,'rgba(26,12,46,.32)');ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);
  ng=ctx.createRadialGradient(W*.74,H*.66,0,W*.74,H*.66,W*.42);
  ng.addColorStop(0,'rgba(40,12,18,.22)');ng.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);

  drawStars();

  // BACK additive layer
  ctx.globalCompositeOperation='lighter';
  smoothHalo();
  drawParticlesLensed();
  smoothDiskLayer('far');
  drawParticles('far');

  // shadow punches the hole
  ctx.globalCompositeOperation='source-over';
  drawShadow();

  // photon ring + FRONT additive layer
  ctx.globalCompositeOperation='lighter';
  drawPhotonGlow();
  smoothDiskLayer('near');
  drawParticles('near');
  drawJets();

  // bloom
  applyBloom();

  // restore crisp black interior + sharp photon ring
  ctx.globalCompositeOperation='source-over';
  drawShadowCore();
  ctx.globalCompositeOperation='lighter';
  drawPhotonSharp();

  // vignette
  ctx.globalCompositeOperation='source-over';
  vignette();

  $('oP').textContent=NPART;
  requestAnimationFrame(frame);
}

resize();readUI();requestAnimationFrame(frame);
</script>
</body>
</html>
