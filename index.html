<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VR Personal Platform</title>
    <link rel="stylesheet" href="./presentation/css/layout3d.css">
</head>
<body>

    <!-- Lớp đồ họa WebGL2 Phong Lighting chạy ngầm phía sau cấu trúc nền -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Điểm neo quản lý không gian và góc nhìn VR -->
    <div id="viewport-vr">
        <div id="scene-3d">
            
            <!-- Hệ thống Đa lớp Parallax Skybox -->
            <div class="skybox-layer sky-deep"></div>
            <div class="skybox-layer sky-mid"></div>
            <div class="skybox-layer sky-near"></div>

            <!-- Khối HUD Central Menu tại tâm tọa độ không gian -->
            <div id="central-menu" class="vr-panel"></div>

            <!-- Các Panel chức năng phục vụ sinh cấu trúc linh động chuyển dời bằng thuật toán vật lý -->
            <div id="settings-panel" class="vr-panel"></div>
            <div id="post-list-panel" class="vr-panel"></div>
            <div id="reader-panel" class="vr-panel"></div>

        </div>
    </div>

    <!-- Điểm kích hoạt khởi động luồng tính toán toàn dự án -->
    <script type="module" src="./application/AppController.js"></script>
</body>
</html>
