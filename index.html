<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<meta
    http-equiv="Content-Security-Policy"
    content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    media-src 'self';
    object-src 'none';
    frame-src 'none';
    base-uri 'self';
    form-action 'self';
"
/>

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0f16">

<title>Web Engine</title>

<link rel="stylesheet" href="./styles/global.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/dashboard.css">
<link rel="stylesheet" href="./styles/cards.css">
<link rel="stylesheet" href="./styles/panels.css">
</head>

<body>

<div id="app-shell">

    <header id="logo-slot" aria-label="Application Logo">
        <img
            id="app-logo"
            src="./assets/logo.svg"
            alt="Application Logo"
            draggable="false"
        >
    </header>

    <canvas
        id="webgl-canvas"
        aria-label="3D World"
    ></canvas>

    <div
        id="ui-overlay"
        aria-hidden="true"
    ></div>

    <div
        id="accessibility-layer"
        aria-hidden="false"
    >

        <button
            id="gyro-toggle"
            type="button"
        >
            Enable Gyroscope
        </button>

        <button
            id="motion-toggle"
            type="button"
        >
            Reduced Motion
        </button>

    </div>

</div>

<noscript>
    <div
        style="
        position:fixed;
        inset:0;
        background:#000;
        color:#fff;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:sans-serif;
        z-index:99999;
        "
    >
        JavaScript is required.
    </div>
</noscript>

<script
    type="module"
    src="./core/bootstrap.js"
></script>

</body>
</html>
