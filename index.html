<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Vanilla Experience</title>
  
  <!-- Hệ thống Stylesheet CSS4+ phục vụ phối cảnh 3D Camera -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Thanh Điều Hướng Hệ Thống Multi-Page (Data-Driven Render) -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="index.html" id="site-logo" class="site-logo">PURE</a>
      <nav class="main-navigation">
        <ul id="nav-list" class="nav-list">
          <!-- Item điều hướng sẽ được render tự động từ config.js -->
        </ul>
      </nav>
      <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <!-- Bảng Cấu Hình Hệ Thống Đồng Bộ Cấu Hình Xuyên Trang (Settings Panel) -->
  <aside id="settings-panel" class="settings-panel hidden">
    <div class="settings-content">
      <h3>Cài Đặt Hệ Thống</h3>
      
      <!-- Lựa chọn Giao diện Hệ Thống -->
      <div class="setting-group">
        <label for="theme-select">Giao diện:</label>
        <select id="theme-select">
          <!-- Các option theme được điều khiển động từ config.js -->
        </select>
      </div>

      <!-- Bật/Tắt Cảm biến Nghiêng Gyroscope cho Thiết Bị Di Động -->
      <div class="setting-group">
        <label for="gyro-switch" class="switch-label">
          <input type="checkbox" id="gyro-switch" checked>
          Sử dụng Cảm biến Nghiêng (Gyroscope)
        </label>
      </div>
    </div>
  </aside>

  <!-- Khung Chứa Góc Nhìn Virtual 3D Camera -->
  <main id="parallax-container" class="parallax-container">
    
    <!-- Layer 1: Nền trời sao thực tế (Nạp link động từ assets-manifest.json) -->
    <section id="layer-bg-stars" class="parallax-layer layer-bg"></section>

    <!-- Layer 2: Dãy núi trung cảnh thực tế (Nạp link động từ assets-manifest.json) -->
    <section id="layer-mg-mountains" class="parallax-layer layer-mg"></section>

    <!-- Layer 3: Khối Tiền Cảnh Chứa Giao Diện Tương Tác Kính Mờ (Glassmorphism) -->
    <section id="layer-fg-content" class="parallax-layer layer-fg">
      <div class="hero-content">
        <h1 id="hero-title">Pure Vanilla Experience</h1>
        <p id="hero-subtitle">Sức mạnh nguyên bản của Web Standards không phụ thuộc Framework.</p>
        
        <div class="cta-actions">
          <a href="about.html" class="btn btn-primary">Khám Phá Ngay</a>
          <button id="hardware-auth-btn" class="btn btn-secondary">Kích Hoạt Cảm Biến</button>
        </div>

        <!-- Vùng hiển thị danh sách bài viết động và nội dung dịch từ file .md sẽ được chèn tự động tại đây -->
      </div>
    </section>

  </main>

  <!-- Khởi tạo Native ESM Modules Điều Phối Toàn Ứng Dụng -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
