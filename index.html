<!DOCTYPE html>
<html lang="en" data-state="loading" data-quality="high" data-fullscreen="false">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="World Multi-Layer Skybox Engine">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none';">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>World Skybox Engine</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="ui/css/reset.css">
    <link rel="stylesheet" href="ui/css/variables.css">
    <link rel="stylesheet" href="ui/css/layout.css">
    <link rel="stylesheet" href="ui/css/skybox.css">
    <link rel="stylesheet" href="ui/css/ui.css">
</head>
<body>
    <noscript>
        <div id="noscript-notice">World Skybox Engine requires JavaScript.</div>
    </noscript>

    <div id="app" role="application" aria-label="World Skybox Engine">

        <canvas
            id="skybox-canvas"
            tabindex="0"
            aria-label="Skybox viewport"
        ></canvas>

        <div
            id="loading-overlay"
            role="status"
            aria-live="polite"
            aria-busy="true"
            aria-label="Loading"
        >
            <div id="loading-container">
                <div id="loading-spinner" aria-hidden="true"></div>
                <p id="loading-label" aria-live="polite"></p>
                <div
                    id="loading-progress"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    aria-label="Loading progress"
                >
                    <div id="loading-progress-bar"></div>
                </div>
            </div>
        </div>

        <div
            id="ui-overlay"
            role="complementary"
            aria-label="Engine interface"
            hidden
        >
            <div id="controls-hint" aria-hidden="true"></div>
        </div>

        <div
            id="settings-panel"
            role="dialog"
            aria-label="Settings"
            aria-modal="true"
            hidden
        >
            <div id="settings-inner">
                <header id="settings-header">
                    <button
                        id="settings-close"
                        type="button"
                        aria-label="Close settings"
                    ></button>
                </header>
                <div id="settings-body"></div>
            </div>
        </div>

        <nav id="engine-controls" aria-label="Engine controls">
            <button
                id="btn-fullscreen"
                type="button"
                aria-label="Toggle fullscreen"
                aria-pressed="false"
            ></button>
            <button
                id="btn-settings"
                type="button"
                aria-label="Open settings"
                aria-expanded="false"
                aria-controls="settings-panel"
            ></button>
        </nav>

        <div
            id="performance-hud"
            role="status"
            aria-live="off"
            aria-atomic="true"
            hidden
        ></div>

    </div>

    <script type="module" src="engine/bootstrap/boot.js"></script>
</body>
</html>
