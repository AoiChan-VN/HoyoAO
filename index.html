<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Vanilla Experience</title>
  
  <!-- 1. Hệ thống Style cốt lõi và Biến số màu sắc CSS4+ -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">

  <!-- 2. Hệ thống Stylesheet Phân rã độc lập theo từng Cấu phần -->
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/article-card.css">

  <!-- 3. Bộ lọc Responsive điều chỉnh ma trận và bóp gọn giao diện Mobile -->
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Thanh Điều Hướng Hệ Thống Multi-Page (Quản lý tự động qua header.js) -->
  <header id="site-header" class="site-header">
    <div class="header-container">
      <a href="index.html" id="site-logo" class="site-logo">PURE</a>
      <nav class="main-navigation">
        <ul id="nav-list" class="nav-list">
          <!-- Các thẻ liên kết điều hướng được render tự động -->
        </ul>
      </nav>
      <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <!-- Bảng Cấu Hình Hệ Thống Đồng Bộ Xuyên Trang (Nạp động qua settings.js) -->
  <aside id="settings-panel" class="settings-panel hidden">
    <!-- Cấu trúc các nhóm chức năng Slider, Ngôn ngữ, Ẩn UI sẽ được tự động chèn vào đây -->
  </aside>

  <!-- Khung Chứa Góc Nhìn Phối Cảnh Mắt Người (Perspective Box) -->
  <main id="parallax-container" class="parallax-container">
    
    <!-- Sân Khấu Lập Thể VR Quay 360 Độ (Khóa chặt tâm ma trận) -->
    <div class="vr-stage">
      
      <!-- Layer 1: Hậu cảnh nền trời sao nội bộ (Trục Z: -300px, Overscan 1.6x trên Mobile) -->
      <section id="layer-bg-stars" class="parallax-layer layer-bg"></section>

      <!-- Layer 2: Trung cảnh dãy núi nội bộ (Trục Z: -150px, Overscan 1.3x trên Mobile) -->
      <section id="layer-mg-mountains" class="parallax-layer layer-mg"></section>

      <!-- Layer 3: Tiền cảnh chứa hệ thống Card lơ lửng VR (Bóp gọn tỷ lệ scale 0.72x trên Mobile) -->
      <section id="layer-fg-content" class="parallax-layer layer-fg">
        <!-- 
          Bảng Dashboard chính diện tối giản diện tích.
          Hệ thống Card bài viết độc lập (.md) và Modal đọc bài viết 
          sẽ được ArticleCardComponent tự động chèn lơ lửng tại đây.
        -->
        <article class="hero-content">
          <h1>Pure Experience</h1>
          <p>Không gian chuẩn tương tác 3D Web Standards.</p>
        </article>
      </section>

    </div>
  </main>

  <!-- Khởi tạo Native ESM Modules Điều Phối Toàn Hệ Thống -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
