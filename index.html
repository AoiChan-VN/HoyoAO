<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aoi VR-XR</title>
    <link rel="stylesheet" href="styles/base/reset.css">
    <link rel="stylesheet" href="styles/base/variables.css">
    <link rel="stylesheet" href="styles/layout/viewport.css">
    <style>
        /* CSS Khẩn cấp bảo đảm hiển thị bảng Debug HUD khi toàn bộ file CSS ngoài bị nghẽn */
        #emergency-hud {
            position: fixed; bottom: 10px; left: 10px; width: calc(100% - 20px);
            background: rgba(0,0,0,0.9); border: 2px solid #ff0055; padding: 12px;
            color: #ff0055; font-family: monospace; font-size: 12px; z-index: 999999;
            box-sizing: border-box; border-radius: 4px; pointer-events: auto;
        }
        .hud-success { color: #05ff60 !important; border-color: #00f0ff !important; }
    </style>
</head>
<body>

    <div class="spatial-viewport">
        <div class="spatial-stage" id="spatial-stage">
            <spatial-skybox></spatial-skybox>
            <spatial-dashboard></spatial-dashboard>
            <spatial-viewer></spatial-viewer>
        </div>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN KHẨN CẤP TRÊN MOBILE -->
    <div id="emergency-hud">
        <b style="font-size:14px;">SPATIAL ENGINE EMERGENCY subsys</b><br>
        <span id="emg-protocol">Protocol: Detecting...</span><br>
        <span id="emg-script">Script Core: WAITING FOR ACTIVATION...</span><br>
        <span id="emg-texture">Texture Engine: STANDBY</span>
    </div>

    <!-- SỬ DỤNG SCRIPT TIÊU CHUẨN ĐỂ VƯỢT QUA CƠ CHẾ CHẶN MODULE CỦA ĐIỆN THOẠI -->
    <script>
        (function() {
            const protocol = window.location.protocol;
            const emgProtocol = document.getElementById('emg-protocol');
            const emgScript = document.getElementById('emg-script');
            const emgTexture = document.getElementById('emg-texture');
            const hud = document.getElementById('emergency-hud');

            emgProtocol.innerText = "Protocol Mode: " + protocol + " (" + (protocol.get === 'file:' ? 'OFFLINE LOCAL' : 'SERVER MODE') + ")";

            // Thuật toán tính toán đường dẫn tuyệt đối chuẩn xác cho mọi môi trường
            let pathname = window.location.pathname;
            if (pathname.endsWith('index.html')) {
                pathname = pathname.substring(0, pathname.lastIndexOf('/'));
            }
            if (!pathname.endsWith('/')) pathname += '/';
            const absoluteTextureBase = window.location.origin + pathname + "src/assets/textures/";

            // Bẫy lỗi toàn cục trên điện thoại di động
            window.onerror = function(message, source, lineno, colno, error) {
                emgScript.style.color = '#ff0055';
                emgScript.innerText = "CRITICAL ERROR: " + message + " at line " + lineno;
                return false;
            };

            // Kiểm tra trực tiếp tệp ảnh pz.webp có tồn tại tại đường dẫn vật lý hay không
            const testImg = new Image();
            testImg.onload = function() {
                hud.className = "hud-success";
                emgTexture.style.color = "#05ff60";
                emgTexture.innerText = "Texture Engine: SUCCESS (Image verified at " + absoluteTextureBase + "pz.webp)";
            };
            testImg.onerror = function() {
                emgTexture.style.color = "#ff0055";
                emgTexture.innerText = "Texture Engine: 404 NOT FOUND (Trình duyệt không tìm thấy ảnh tại: " + absoluteTextureBase + "pz.webp)";
            };
            testImg.src = absoluteTextureBase + "pz.webp";

            // Xác nhận luồng HTML đã nạp thành công
            emgScript.style.color = "#05ff60";
            emgScript.innerText = "Script Core: DOM Bootloader Active. Loading main modules...";
        })();
    </script>

    <!-- Kích hoạt luồng module chuẩn -->
    <script type="module" src="main.js"></script>
</body>
</html>
