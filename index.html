<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Skybox 360 - Camera At Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* --- KHÔNG GIAN 3D: ĐẶT MẮT NGƯỜI XEM Ở TÂM --- */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 500px; /* Tiêu cự tạo độ sâu vừa phải cho mắt nhìn */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective-origin: center;
        }

        /* --- KHỐI LẬP PHƯƠNG BAO QUANH CAMERA --- */
        .cube {
            width: 1000px;
            height: 1000px;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
            /* Khởi tạo góc nhìn ban đầu */
            transform: rotateX(0deg) rotateY(0deg);
            transition: transform 0.1s ease-out; /* Tạo độ mượt khi vuốt */
        }

        /* --- CẤU HÌNH 6 MẶT HƯỚNG VÀO TRONG --- */
        .face {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background-size: 101% 101%; /* Tránh các khe hở nhỏ giữa các cạnh */
            background-position: center;
            background-repeat: no-repeat;
            /* QUAN TRỌNG: Lật mặt ảnh vào trong tâm để không bị ngược hình */
            backface-visibility: visible; 
        }

        /* 
           Kích thước cạnh là 1000px, tâm khối là 0. 
           Do đó, mỗi mặt phải lùi ra xa tâm một khoảng bằng bán kính = 500px.
        */
        .front  { transform: rotateY(  0deg) translateZ(-500px); background-image: url('assets/skybox/front.webp'); }
        .back   { transform: rotateY(180deg) translateZ(-500px); background-image: url('assets/skybox/back.webp'); }
        .right  { transform: rotateY(-90deg) translateZ(-500px); background-image: url('assets/skybox/right.webp'); }
        .left   { transform: rotateY( 90deg) translateZ(-500px); background-image: url('assets/skybox/left.webp'); }
        .top    { transform: rotateX(-90deg) translateZ(-500px); background-image: url('assets/skybox/top.webp'); }
        .bottom { transform: rotateX( 90deg) translateZ(-500px); background-image: url('assets/skybox/bottom.webp'); }

        /* GIAO DIỆN CHỮ */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none; 
            z-index: 10;
        }
        .overlay h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .overlay p {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="cube" id="skybox">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <div class="overlay">
        <h1>CENTER 360° VIEW</h1>
        <p>Vuốt tự do để xoay toàn cảnh bầu trời</p>
    </div>

    <script>
        const cube = document.getElementById('skybox');
        
        // Độ nhạy khi vuốt (giảm xuống một chút để xoay mượt, không bị chóng mặt)
        const sensitivity = 0.2; 
        
        let currentX = 0; 
        let currentY = 0; 
        
        let startX = 0;   
        let startY = 0;
        let isDragging = false;

        // --- SỰ KIỆN TRÊN ĐIỆN THOẠI ---
        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;
            
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            
            // Khi đứng ở TRONG tâm, vuốt sang phải thì camera phải quay sang trái (đảo dấu)
            currentY -= deltaX * sensitivity;
            currentX += deltaY * sensitivity;
            
            // Giới hạn góc ngước lên/xuống 85 độ để tránh bị đảo lộn đầu
            currentX = Math.max(-85, Math.min(85, currentX));
            
            cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        // --- SỰ KIỆN TRÊN MÁY TÍNH (ĐỂ TEST) ---
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            startX = e.clientX;
            startY = e.clientY;
            
            currentY -= deltaX * sensitivity;
            currentX += deltaY * sensitivity;
            currentX = Math.max(-85, Math.min(85, currentX));
            
            cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
