<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Website Parallax - Multi-layered 3D Skybox Cube</title>
    
    <!-- Cấu hình đường dẫn ảnh động bằng JavaScript để tương thích tự động mọi môi trường deploy -->
    <style id="skybox-images"></style>

    <!-- Script nhận diện thiết bị và nạp file CSS tối ưu đường dẫn tương thích GitHub Pages -->
    <script>
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isGitHubPages = window.location.hostname.includes('github.io');
            const pathSegments = window.location.pathname.split('/').filter(s => s.length > 0);
            
            // Sửa lỗi: Lấy chính xác tên repository và tạo đường dẫn tuyệt đối chuẩn xác
            const basePath = (isGitHubPages && pathSegments.length > 0) ? '/' + pathSegments[0] : '';
            
            // Tự động thiết lập cấu hình biến ảnh chạy từ gốc dự án
            const styleTag = document.getElementById('skybox-images');
            styleTag.innerHTML = `
                :root {
                    --near-front: url('${basePath}/assets/skybox/near/front.png');
                    --near-back: url('${basePath}/assets/skybox/near/back.png');
                    --near-left: url('${basePath}/assets/skybox/near/left.png');
                    --near-right: url('${basePath}/assets/skybox/near/right.png');
                    --near-top: url('${basePath}/assets/skybox/near/top.png');
                    --near-bottom: url('${basePath}/assets/skybox/near/bottom.png');

                    --medium-front: url('${basePath}/assets/skybox/medium/front.webp');
                    --medium-back: url('${basePath}/assets/skybox/medium/back.webp');
                    --medium-left: url('${basePath}/assets/skybox/medium/left.webp');
                    --medium-right: url('${basePath}/assets/skybox/medium/right.webp');
                    --medium-top: url('${basePath}/assets/skybox/medium/top.webp');
                    --medium-bottom: url('${basePath}/assets/skybox/medium/bottom.webp');

                    --far-front: url('${basePath}/assets/skybox/far/front.hdr');
                    --far-back: url('${basePath}/assets/skybox/far/back.hdr');
                    --far-left: url('${basePath}/assets/skybox/far/left.hdr');
                    --far-right: url('${basePath}/assets/skybox/far/right.hdr');
                    --far-top: url('${basePath}/assets/skybox/far/top.hdr');
                    --far-bottom: url('${basePath}/assets/skybox/far/bottom.hdr');
                }
            `;

            const cssPath = isMobile ? `${basePath}/css/mobile/main.css` : `${basePath}/css/pc/main.css`;
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = cssPath;
            document.head.appendChild(link);
            
            document.documentElement.setAttribute('data-device', isMobile ? 'mobile' : 'pc');
        })();
    </script>
</head>
<body>

    <div id="viewport-3d">
        <div id="world-container">
            <!-- TẦNG XA -->
            <div class="cube-layer layer-far" id="cube-far">
                <div class="cube-face face-front"></div>
                <div class="cube-face face-back"></div>
                <div class="cube-face face-left"></div>
                <div class="cube-face face-right"></div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
            </div>

            <!-- TẦNG VỪA -->
            <div class="cube-layer layer-medium" id="cube-medium">
                <div class="cube-face face-front"></div>
                <div class="cube-face face-back"></div>
                <div class="cube-face face-left"></div>
                <div class="cube-face face-right"></div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
            </div>

            <!-- TẦNG GẦN -->
            <div class="cube-layer layer-near" id="cube-near">
                <div class="cube-face face-front"></div>
                <div class="cube-face face-back"></div>
                <div class="cube-face face-left"></div>
                <div class="cube-face face-right"></div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const isMobile = document.documentElement.getAttribute('data-device') === 'mobile';
            const isGitHubPages = window.location.hostname.includes('github.io');
            const pathSegments = window.location.pathname.split('/').filter(s => s.length > 0);
            const basePath = (isGitHubPages && pathSegments.length > 0) ? '/' + pathSegments[0] : '';
            
            const jsPath = isMobile ? `${basePath}/js/mobile/app.js` : `${basePath}/js/pc/app.js`;
            const script = document.createElement('script');
            script.type = 'module';
            script.src = jsPath;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
