<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Personal Portfolio VR Platform</title>
    
    <!-- Nạp cấu hình biến toàn cục và reset CSS -->
    <link rel="stylesheet" href="./styles/base/reset.css">
    <link rel="stylesheet" href="./styles/base/variables.css">
    
    <!-- Nạp cấu hình Viewport không gian 3D -->
    <link rel="stylesheet" href="./styles/layout/viewport.css">
    
    <!-- Khởi tạo cấu trúc shadow DOM ẩn/hiện hoặc fallback nếu không hỗ trợ javascript -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: var(--font-primary, sans-serif);
        }
        
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            color: #ffffff;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ tải tài nguyên và khởi tạo môi trường VR -->
    <div id="app-loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; letter-spacing: 2px; font-size: 14px;">INITIALIZING VR SPACE...</p>
    </div>

    <!-- Khung nhìn Viewport VR chính nơi chứa ma trận camera và tương tác phối cảnh -->
    <div id="vr-viewport" class="vr-viewport">
        <!-- Node gốc chứa toàn bộ thành phần không gian 3D được điều khiển bởi Ma Trận Camera -->
        <div id="vr-scene-root" class="vr-scene-root">
            
            <!-- Web Component: Skybox 6 mặt (Ảnh WebP/Jpeg nội bộ) -->
            <vr-skybox></vr-skybox>
            
            <!-- Khu vực chứa các Panel tương tác phân tách trong không gian VR -->
            <div class="vr-content-layer">
                <!-- Web Component: Panel chính chứa thông tin Portfolio -->
                <vr-panel id="main-portfolio-panel">
                    <!-- Nội dung Markdown sẽ được parse và inject vào đây qua Component Card -->
                    <vr-card type="profile" title="Developer Profile"></vr-card>
                    <vr-card type="projects" title="Featured Projects"></vr-card>
                </vr-panel>
            </div>

        </div>
    </div>

    <!-- Lớp phủ UI tĩnh cho các bảng điều khiển hệ thống, Modal và Settings độc lập -->
    <div id="ui-overlay-layer">
        <!-- Bảng cấu hình chức năng, bật tắt Gyroscope / Cảm biến -->
        <vr-settings></vr-settings>
        
        <!-- Cửa sổ Modal popup hiển thị nội dung chi tiết bài viết Markdown khi click vào Card -->
        <vr-modal id="global-detail-modal"></vr-modal>
    </div>

    <!-- Khởi chạy Bootstrap Core Module Engine của ứng dụng -->
    <script type="module">
        import { BootstrapApp } from './src/app.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Khởi tạo nền tảng ứng dụng VR Portfolio
            const app = new BootstrapApp({
                viewportId: 'vr-viewport',
                sceneRootId: 'vr-scene-root',
                loaderId: 'app-loader'
            });
            app.init();
        });
    </script>
</body>
</html>
