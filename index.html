<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>4D Parallax 360 Engine</title>

<style>
/* =========================
   RESET + BASE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05060a;
  font-family: system-ui, sans-serif;
  color: white;
}

/* =========================
   SCENE SYSTEM
========================= */
.scene {
  position: relative;
  width: 100%;
  height: 100%;
  perspective: 1200px;
  overflow: hidden;
}

.world {
  position: absolute;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
}

/* =========================
   LAYERS (DEPTH ENGINE)
========================= */
.layer {
  position: absolute;
  width: 120%;
  height: 120%;
  top: -10%;
  left: -10%;
  background-size: cover;
  background-position: center;
  transform-style: preserve-3d;
}

/* fake depth visuals */
.bg {
  background: radial-gradient(circle at center, #1a1f3c, #05060a);
  transform: translateZ(-400px) scale(2);
}

.stars {
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.2;
  transform: translateZ(-200px) scale(1.5);
}

.mid {
  background: linear-gradient(120deg, rgba(0,255,200,0.08), rgba(0,120,255,0.05));
  transform: translateZ(0px);
}

.front {
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 60%);
  transform: translateZ(200px) scale(0.8);
}

/* =========================
   UI
========================= */
.ui {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;
  background: rgba(0,0,0,0.4);
  padding: 12px 14px;
  border-radius: 12px;
  backdrop-filter: blur(10px);
}

button {
  margin-top: 8px;
  padding: 8px 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #00ffd0;
  color: #000;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="scene" id="scene">
  <div class="world" id="world">

    <div class="layer bg"></div>
    <div class="layer stars"></div>
    <div class="layer mid"></div>
    <div class="layer front"></div>

  </div>
</div>

<div class="ui">
  <div>🧭 4D Parallax Engine</div>
  <div id="status">Gyro: OFF</div>
  <button id="enableGyro">Enable Gyroscope</button>
</div>

<script>
/* =====================================================
   4D PARALLAX + 360 ENGINE (NO FRAMEWORK)
===================================================== */

const world = document.getElementById("world");
const status = document.getElementById("status");
const btn = document.getElementById("enableGyro");

let targetX = 0, targetY = 0;
let currentX = 0, currentY = 0;

let gyroEnabled = false;

/* =========================
   SMOOTH INTERPOLATION
========================= */
function lerp(a, b, n) {
  return (1 - n) * a + n * b;
}

/* =========================
   APPLY TRANSFORM
========================= */
function update() {
  currentX = lerp(currentX, targetX, 0.08);
  currentY = lerp(currentY, targetY, 0.08);

  const rotateY = currentX * 30;
  const rotateX = currentY * 30;

  world.style.transform =
    `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

  requestAnimationFrame(update);
}

update();

/* =========================
   MOUSE / TOUCH CONTROL
========================= */
function handleMove(x, y, width, height) {
  const nx = (x / width) - 0.5;
  const ny = (y / height) - 0.5;

  targetX = nx;
  targetY = ny;
}

window.addEventListener("mousemove", (e) => {
  handleMove(e.clientX, e.clientY, window.innerWidth, window.innerHeight);
});

window.addEventListener("touchmove", (e) => {
  if (!e.touches[0]) return;
  handleMove(e.touches[0].clientX, e.touches[0].clientY, window.innerWidth, window.innerHeight);
});

/* =========================
   GYROSCOPE SUPPORT
========================= */
async function enableGyro() {
  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {

      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        status.innerText = "Gyro: DENIED";
        return;
      }
    }

    window.addEventListener("deviceorientation", (event) => {
      if (event.gamma === null || event.beta === null) return;

      gyroEnabled = true;

      const gamma = event.gamma; // left/right
      const beta = event.beta;   // front/back

      targetX = gamma / 45;
      targetY = beta / 45;

      status.innerText = "Gyro: ON";
    });

    status.innerText = "Gyro: READY";
  } catch (err) {
    status.innerText = "Gyro: ERROR";
  }
}

btn.addEventListener("click", enableGyro);

/* =========================
   SAFE FALLBACK MESSAGE
========================= */
window.addEventListener("load", () => {
  if (!gyroEnabled) {
    status.innerText += " | Mouse mode active";
  }
});
</script>

</body>
</html>
