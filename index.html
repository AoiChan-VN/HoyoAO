<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoyoAO · Web Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/core.css">
</head>
<body>
  <!-- ══════ INDEX SHELL — nhân bất biến, KHÔNG sửa khi thêm module ══════ -->
  <div id="os" class="os">
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <div class="topbar-center">
        <span class="crumb">Hệ thống</span><span class="crumb-sep">/</span>
        <strong id="pageTitle" class="display">Dashboard</strong>
      </div>
      <div class="topbar-right">
        <div class="sys-clock" id="sysClock"></div>
        <div class="avatar" id="avatarChip"></div>
      </div>
    </header>
    <div class="body">
      <nav class="sidenav" id="sidenav"></nav>
      <main class="main" id="main"></main>
    </div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
  <div id="modalLayer"></div>
  <div id="toastLayer"></div>
  <script type="module" src="core/boot.js"></script>
</body>
</html>
