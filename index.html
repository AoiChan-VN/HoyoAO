<!-- ==========================================================================
     index.html
     Native Browser Experience Engine
     ========================================================================== -->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#000000">

    <title>
        Native Experience Engine
    </title>

    <link
        rel="stylesheet"
        href="./css/reset.css">

    <link
        rel="stylesheet"
        href="./css/variables.css">

    <link
        rel="stylesheet"
        href="./css/experience.css">

    <link
        rel="stylesheet"
        href="./css/main.css">

</head>

<body
    data-hdri="./assets/hdri/default.webp">

    <!-- =============================================================== -->
    <!-- LOADING -->
    <!-- =============================================================== -->

    <div
        id="loading-screen">

        <div
            class="loading-content">

            <div
                class="loading-logo">

                AOI

            </div>

            <div
                class="loading-spinner">
            </div>

        </div>

    </div>

    <!-- =============================================================== -->
    <!-- APP -->
    <!-- =============================================================== -->

    <div
        id="app">

        <!-- =========================================================== -->
        <!-- HEADER -->
        <!-- =========================================================== -->

        <header
            class="site-header">

            <a
                class="logo"
                href="./index.html">

                <img
                    src="./assets/logo/logo.webp"
                    alt="Logo">

            </a>

            <nav
                class="header-actions">

                <button
                    id="enable-gyro"
                    class="header-button">

                    Enable Gyroscope

                </button>

                <a
                    href="./wiki.html"
                    class="header-button">

                    Open Wiki

                </a>

            </nav>

        </header>

        <!-- =========================================================== -->
        <!-- EXPERIENCE -->
        <!-- =========================================================== -->

        <main
            id="experience-scene">

            <!-- ======================================================= -->
            <!-- HDRI -->
            <!-- ======================================================= -->

            <section
                id="hdri-container">

                <img
                    id="hdri-image"
                    alt="HDRI">

            </section>

            <!-- ======================================================= -->
            <!-- SKYBOX -->
            <!-- ======================================================= -->

            <section
                id="skybox-root">

                <div
                    id="skybox-background"
                    class="skybox-layer">
                </div>

                <div
                    id="skybox-atmosphere"
                    class="skybox-layer">
                </div>

                <div
                    id="skybox-foreground"
                    class="skybox-layer">
                </div>

            </section>

            <!-- ======================================================= -->
            <!-- PARALLAX -->
            <!-- ======================================================= -->

            <section
                id="parallax-root">

                <div
                    id="parallax-layer-back"
                    class="parallax-layer">

                    <img
                        src="./assets/skybox/parallax/back.webp"
                        alt="Back Layer">

                </div>

                <div
                    id="parallax-layer-middle"
                    class="parallax-layer">

                    <img
                        src="./assets/skybox/parallax/middle.webp"
                        alt="Middle Layer">

                </div>

                <div
                    id="parallax-layer-front"
                    class="parallax-layer">

                    <img
                        src="./assets/skybox/parallax/front.webp"
                        alt="Front Layer">

                </div>

            </section>

            <!-- ======================================================= -->
            <!-- HERO -->
            <!-- ======================================================= -->

            <section
                class="hero">

                <div
                    class="hero-content">

                    <h1>

                        Native Browser
                        Experience Engine

                    </h1>

                    <p>

                        HDRI • Skybox •
                        Gyroscope • Parallax

                    </p>

                    <a
                        href="./wiki.html"
                        class="hero-button">

                        Enter Wiki

                    </a>

                </div>

            </section>

        </main>

    </div>

    <!-- =============================================================== -->
    <!-- SCRIPT -->
    <!-- =============================================================== -->

    <script
        type="module"
        src="./js/main.js">
    </script>

</body>

</html>
