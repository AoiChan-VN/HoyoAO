<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Vanilla JavaScript 3D Skybox Experience"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>3D Skybox Experience</title>

    <!-- ================================================================== -->
    <!-- Core CSS                                                           -->
    <!-- ================================================================== -->

    <link
        rel="stylesheet"
        href="./css/core/reset.css"
    >

    <link
        rel="stylesheet"
        href="./css/core/design-tokens.css"
    >

    <link
        rel="stylesheet"
        href="./css/core/global.css"
    >

    <!-- ================================================================== -->
    <!-- Shared CSS                                                         -->
    <!-- ================================================================== -->

    <link
        rel="stylesheet"
        href="./css/shared/navigation.css"
    >

    <link
        rel="stylesheet"
        href="./css/shared/footer.css"
    >

    <!-- ================================================================== -->
    <!-- Home Domain CSS                                                    -->
    <!-- ================================================================== -->

    <link
        rel="stylesheet"
        href="./css/pages/home/layout.css"
    >

    <link
        rel="stylesheet"
        href="./css/pages/home/skybox-cube.css"
    >

    <!-- ================================================================== -->
    <!-- Utilities                                                          -->
    <!-- ================================================================== -->

    <link
        rel="stylesheet"
        href="./css/utils/helpers.css"
    >
</head>

<body>
    <!-- =============================================================== -->
    <!-- Home Domain Root                                                -->
    <!-- =============================================================== -->

    <main
        class="home-domain"
        id="home-domain"
        aria-label="3D Skybox Experience"
    >
        <!-- =========================================================== -->
        <!-- Skybox Render Target                                        -->
        <!-- =========================================================== -->

        <div
            id="home-skybox-root"
            aria-hidden="true"
        ></div>

        <!-- =========================================================== -->
        <!-- Overlay Render Target                                       -->
        <!-- =========================================================== -->

        <div
            id="home-overlay-root"
        ></div>
    </main>

    <!-- =============================================================== -->
    <!-- Application Bootstrap                                           -->
    <!-- =============================================================== -->

    <script
        type="module"
        src="./js/app.js"
    ></script>
</body>
</html>
