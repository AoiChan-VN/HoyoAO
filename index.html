<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    >
    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            img-src 'self' data: blob:;
            script-src 'self';
            style-src 'self';
            connect-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'none';
            upgrade-insecure-requests;
        "
    >
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>Enterprise Native WebGL2 Skybox Platform</title>

    <link
        rel="preload"
        href="./src/main.js"
        as="script"
        crossorigin="anonymous"
    >

    <link
        rel="stylesheet"
        href="./css/main.css"
    >
</head>
<body>
    <main
        id="application"
        class="application"
        aria-label="3D Environment Application"
    >
        <canvas
            id="webgl-canvas"
            class="webgl-canvas"
            aria-label="3D Rendering Surface"
            tabindex="0"
        ></canvas>

        <section
            id="ui-overlay"
            class="ui-overlay"
            aria-label="Application Overlay"
        >
            <header class="hud-panel">
                <h1 class="hud-title">
                    Enterprise Native 3D Platform
                </h1>

                <div class="hud-status-group">
                    <span id="status-renderer" class="hud-status">
                        Renderer: Initializing
                    </span>

                    <span id="status-fps" class="hud-status">
                        FPS: --
                    </span>

                    <span id="status-input" class="hud-status">
                        Input: Idle
                    </span>
                </div>
            </header>

            <aside class="hud-controls">
                <button
                    id="gyro-enable-button"
                    class="ui-button"
                    type="button"
                >
                    Enable Gyroscope
                </button>
            </aside>
        </section>
    </main>

    <script
        type="module"
        src="./src/main.js"
    ></script>
</body>
</html>
