<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aoi Platform</title>
    <link rel="stylesheet" href="styles/base/reset.css">
    <link rel="stylesheet" href="styles/base/variables.css">
    <link rel="stylesheet" href="styles/layout/viewport.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: var(--font-primary, sans-serif);
        }
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020205;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            color: #ffffff;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 255, 204, 0.1);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ khởi tạo không gian VR -->
    <div id="app-loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; letter-spacing: 3px; font-size: 12px; color: #00ffcc; text-shadow: 0 0 8px rgba(0,255,204,0.5);">INITIALIZING VR SPACE...</p>
    </div>

    <!-- Khung nhìn tối cao - Không bị các lớp 2D phẳng chiếm quyền Raycast -->
    <div id="vr-viewport" class="vr-viewport">
        <div id="vr-scene-root" class="vr-scene-root">
            
            <!-- Thực thể 1: Skybox 6 mặt nền -->
            <vr-skybox></vr-skybox>
            
            <!-- Thực thể 2: Bảng Panel hiển thị thông tin Portfolio và các bài viết -->
            <vr-panel id="main-portfolio-panel">
                <vr-card type="profile" title="Developer Profile"></vr-card>
                <vr-card type="projects" title="Featured Projects"></vr-card>
            </vr-panel>

            <!-- Thực thể 3: Bảng Menu Dashboard & Cấu hình VR lơ lửng, cho phép cầm nắm kéo thả tự do -->
            <vr-settings></vr-settings>

        </div>
    </div>

    <!-- Cửa sổ xem chi tiết bài viết, bọc ngoài luồng xoay để đọc văn bản phẳng tĩnh ổn định -->
    <vr-modal id="global-detail-modal"></vr-modal>

    <!-- Kích hoạt lõi điều phối thực thể -->
    <script type="module" src="main.js"></script>
</body>
</html>
