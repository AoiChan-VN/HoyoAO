<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portfolio 3D VR</title>
    
    <!-- PWA & Meta Capabilities -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/images/icons/icon-192.png">

    <!-- Phân Hệ Stylesheets Phân Rã CSS4+ Chuyên Nghiệp -->
    <link rel="stylesheet" href="./assets/css/variables.css">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    <link rel="stylesheet" href="./assets/css/vr-overlay.css">
</head>
<body>

    <!-- Lớp Đồ Họa Nền Native WebGL2 VR Canvas -->
    <div id="vr-container">
        <canvas id="vr-canvas"></canvas>
    </div>

    <!-- Điểm Neo Cho Hệ Thống DOM Renderer (Application Shell UI) -->
    <div id="app"></div>

    <!-- Entry Point Khởi Động Hệ Thống (ES6 Modules) -->
    <script type="module" src="./src/main.js"></script>

    <!-- Đăng Ký Hệ Thống Vận Hành Ngoại Tuyến Toàn Diện -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker active:', reg.scope))
                    .catch(err => console.error('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
