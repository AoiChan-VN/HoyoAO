<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content=""
        data-i18n-meta="site.description"
    >

    <meta
        name="keywords"
        content=""
        data-dynamic-meta="keywords"
    >

    <meta
        name="author"
        content=""
        data-dynamic-meta="author"
    >

    <meta
        name="theme-color"
        content="#0f1117"
        id="theme-color-meta"
    >

    <meta
        name="color-scheme"
        content="dark light"
    >

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge"
    >

    <!-- Open Graph -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="" data-dynamic-meta="og:title">
    <meta property="og:description" content="" data-dynamic-meta="og:description">
    <meta property="og:image" content="" data-dynamic-meta="og:image">
    <meta property="og:url" content="" data-dynamic-meta="og:url">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="" data-dynamic-meta="twitter:title">
    <meta name="twitter:description" content="" data-dynamic-meta="twitter:description">
    <meta name="twitter:image" content="" data-dynamic-meta="twitter:image">

    <link
        rel="canonical"
        href="/"
        id="canonical-link"
    >

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <link
        rel="icon"
        href="/assets/icons/favicon.ico"
        sizes="any"
    >

    <link
        rel="apple-touch-icon"
        href="/assets/icons/apple-touch-icon.png"
    >

    <!-- Design Tokens -->

    <link
        rel="stylesheet"
        href="/assets/css/tokens.css"
    >

    <!-- Base -->

    <link
        rel="stylesheet"
        href="/assets/css/base.css"
    >

    <title data-dynamic-title>
        Loading...
    </title>

    <script type="application/ld+json" id="structured-data">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "",
        "url": ""
    }
    </script>
</head>

<body>

    <!-- Skip Navigation -->

    <a
        href="#main-content"
        class="skip-link"
        aria-label="Skip to content"
    >
        Skip to content
    </a>

    <!-- App -->

    <div
        id="app"
        class="app-shell"
        data-theme=""
        data-language=""
    >

        <!-- Parallax Root -->

        <div
            id="parallax-root"
            class="parallax-root"
            aria-hidden="true"
        ></div>

        <!-- Header -->

        <header
            id="site-header"
            class="site-header"
            role="banner"
        >
            <nav
                id="navigation"
                class="navigation"
                aria-label="Primary Navigation"
            ></nav>
        </header>

        <!-- Main -->

        <main
            id="main-content"
            tabindex="-1"
            role="main"
        >

            <aside
                id="table-of-contents"
                class="table-of-contents"
                aria-label="Table of Contents"
            ></aside>

            <section
                id="view"
                class="view-container"
                aria-live="polite"
            ></section>

        </main>

        <!-- Search -->

        <section
            id="search-panel"
            class="search-panel"
            hidden
            aria-label="Search"
        ></section>

        <!-- Settings -->

        <section
            id="settings-panel"
            class="settings-panel"
            hidden
            aria-label="Settings"
        ></section>

        <!-- Reading Progress -->

        <div
            id="reading-progress"
            class="reading-progress"
            aria-hidden="true"
        >
            <div
                id="reading-progress-bar"
                class="reading-progress-bar"
            ></div>
        </div>

        <!-- Toast -->

        <div
            id="toast-root"
            class="toast-root"
            aria-live="polite"
            aria-atomic="true"
        ></div>

        <!-- Modal -->

        <div
            id="modal-root"
            class="modal-root"
            aria-hidden="true"
        ></div>

        <!-- Footer -->

        <footer
            id="site-footer"
            class="site-footer"
            role="contentinfo"
        ></footer>

    </div>

    <!-- No Script -->

    <noscript>
        <div class="noscript-warning">
            This website requires JavaScript to function properly.
        </div>
    </noscript>

    <!-- Core Bootstrap -->

    <script
        type="module"
        src="/src/core/app.js"
    ></script>

</body>
</html>
