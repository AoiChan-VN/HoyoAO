<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Space Shooter 2026</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layouts/game_layout.css">
<link rel="stylesheet" href="css/components/menu.css">
<link rel="stylesheet" href="css/components/shop.css">
<link rel="stylesheet" href="css/components/inventory.css">
<link rel="stylesheet" href="css/components/joystick.css">
</head>
<body>
<div id="game-container">
<canvas id="webgl-canvas"></canvas>
<div id="game-hud" class="hidden">
<div class="hud-top">
<div id="hud-score">SCORE: 0</div>
<div id="hud-credits">CREDITS: 0$</div>
</div>
<div class="hud-bottom">
<div class="bar-container">
<div class="bar-label">HP</div>
<div class="bar-outer">
<div id="hud-hp-bar" class="bar-inner hp-bg"></div>
</div>
</div>
<div class="bar-container">
<div class="bar-label">SHIELD</div>
<div class="bar-outer">
<div id="hud-shield-bar" class="bar-inner shield-bg"></div>
</div>
</div>
</div>
<button id="btn-pause-game">II</button>
</div>
<div id="screen-menu" class="screen-overlay">
<div class="menu-box">
<h1 class="game-title">SPACE SHOOTER 3D</h1>
<div class="menu-buttons">
<button id="btn-start-game" class="menu-btn primary">KÍCH HOẠT HỆ THỐNG</button>
<button id="btn-open-inventory" class="menu-btn">KHO ĐỒ TRANG BỊ</button>
<button id="btn-open-shop" class="menu-btn">TRẠM CUNG ỨNG</button>
</div>
</div>
</div>
<div id="screen-shop" class="screen-overlay hidden">
<div class="panel-box">
<div class="panel-header">
<h2>TRẠM CUNG ỨNG VŨ KHÍ</h2>
<span id="shop-currency">0$</span>
</div>
<div class="panel-body">
<div class="shop-grid" id="shop-item-container"></div>
</div>
<div class="panel-footer">
<button id="btn-close-shop" class="panel-btn-close">QUAY LẠI</button>
</div>
</div>
</div>
<div id="screen-inventory" class="screen-overlay hidden">
<div class="panel-box">
<div class="panel-header">
<h2>KHO ĐỒ PHI THUYỀN</h2>
</div>
<div class="panel-body">
<div class="inventory-grid" id="inventory-item-container"></div>
</div>
<div class="panel-footer">
<button id="btn-close-inventory" class="panel-btn-close">QUAY LẠI</button>
</div>
</div>
</div>
<div id="screen-pause" class="screen-overlay hidden">
<div class="menu-box">
<h2 class="pause-title">HỆ THỐNG TẠM DỪNG</h2>
<div class="menu-buttons">
<button id="btn-resume-game" class="menu-btn primary">TIẾP TỤC</button>
<button id="btn-quit-game" class="menu-btn danger">THOÁT RA MENU</button>
</div>
</div>
</div>
<div id="screen-gameover" class="screen-overlay hidden">
<div class="menu-box">
<h1 class="gameover-title">PHI THUYỀN BỊ PHÁ HỦY</h1>
<div class="gameover-stats">
<p>DIỂM SỐ ĐẠT ĐƯỢC: <span id="final-score">0</span></p>
<p>TIỀN THƯỞNG THU THẬP: <span id="final-credits">0</span>$</p>
</div>
<div class="menu-buttons">
<button id="btn-restart-game" class="menu-btn primary">TÁI KHỞI ĐỘNG</button>
<button id="btn-go-menu" class="menu-btn">QUAY LẠI MENU</button>
</div>
</div>
</div>
<div id="screen-loading" class="screen-overlay">
<div class="loading-box">
<div class="loading-spinner"></div>
<div id="loading-text">DANG TẢI TÀI NGUYÊN KHÔNG GIAN... 0%</div>
</div>
</div>
<div id="virtual-joystick-zone" class="hidden">
<div id="joystick-base">
<div id="joystick-handle"></div>
</div>
<button id="btn-virtual-fire"></button>
</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
