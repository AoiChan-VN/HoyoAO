<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Skybox Fixed Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* --- VÙNG NHÌN 3D --- */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 500px; /* Tiêu cự camera cố định */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective-origin: 50% 50%;
        }

        /* --- KHỐI LẬP PHƯƠNG XOAY QUANH TÂM CAMERA --- */
        .cube {
            width: 1000px;
            height: 1000px;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
            transform: rotateX(0deg) rotateY(0deg);
        }

        /* --- CẤU HÌNH TỪNG MẶT: KHÓA CHẶT GỐC TỌA ĐỘ VÀO TÂM --- */
        .face {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background-size: 102% 102%; /* Khít hoàn toàn các đường viền cạnh */
            background-position: center;
            background-repeat: no-repeat;
            
            /* Dịch chuyển tâm xoay của TỪNG mặt lùi về sau 500px (đúng tâm hình lập phương) */
            transform-origin: center center -500px; 
            
            /* Chỉ hiển thị mặt quay vào trong mắt người xem */
            backface-visibility: hidden; 
        }

        /* 
           Xoay các mặt theo đúng hướng bao bọc xung quanh camera.
           Do tâm xoay đã được lùi -500px ở trên, nên ở đây CHỈ CẦN XOAY góc, không cần dùng translateZ nữa.
        */
        .front  { transform: rotateY(  0deg); background-image: url('assets/skybox/front.webp'); }
        .back   { transform: rotateY(180deg); background-image: url('assets/skybox/back.webp'); }
        .right  { transform: rotateY( 90deg); background-image: url('assets/skybox/right.webp'); }
        .left   { transform: rotateY(-90deg); background-image: url('assets/skybox/left.webp'); }
        .top    { transform: rotateX( 90deg); background-image: url('assets/skybox/top.webp'); }
        .bottom { transform: rotateX(-90deg); background-image: url('assets/skybox/bottom.webp'); }

        /* GIAO DIỆN TEXT */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            pointer-events: none; 
            z-index: 10;
        }
        .overlay h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .overlay p {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="cube" id="skybox">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <div class="overlay">
        <h1>TRUE 360° SKYBOX</h1>
        <p>Vuốt để xoay (Camera đã khóa ở tâm)</p>
    </div>

    <script>
        const cube = document.getElementById('skybox');
        const sensitivity = 0.25; // Tốc độ xoay camera
        
        let currentX = 0; 
        let currentY = 0; 
        let startX = 0;   
        let startY = 0;
        let isDragging = false;

        // --- XỬ LÝ TRÊN ĐIỆN THOẠI (TOUCH) ---
        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;
            
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            
            // Đảo dấu để hướng xoay camera tự nhiên như thật
            currentY += deltaX * sensitivity;
            currentX -= deltaY * sensitivity;
            
            // Khóa góc ngước lên/nhìn xuống tránh lỗi lật ngửa camera
            currentX = Math.max(-85, Math.min(85, currentX));
            
            cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        // --- XỬ LÝ TRÊN MÁY TÍNH (MOUSE) ---
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            startX = e.clientX;
            startY = e.clientY;
            
            currentY += deltaX * sensitivity;
            currentX -= deltaY * sensitivity;
            currentX = Math.max(-85, Math.min(85, currentX));
            
            cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
