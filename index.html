<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cyan" data-density="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LATTICE OS — a universal web platform engineered like an operating system. Modular, data-driven, asset-driven, configuration-driven.">
<title>LATTICE OS · Universal Web Platform</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-600-normal.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --u:1;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --ok:#34d399; --warn:#fbbf24; --err:#f87171;
}
html[data-accent="cyan"]{--accent:#22d3ee;--accent-soft:rgba(34,211,238,.13)}
html[data-accent="violet"]{--accent:#a78bfa;--accent-soft:rgba(167,139,250,.15)}
html[data-accent="emerald"]{--accent:#34d399;--accent-soft:rgba(52,211,153,.13)}
html[data-accent="amber"]{--accent:#fbbf24;--accent-soft:rgba(251,191,36,.15)}
html[data-theme="dark"]{
  --bg:#070b12; --bg-2:#0d141f; --panel:rgba(13,20,31,.72); --panel-solid:#0d141f;
  --border:rgba(148,170,200,.14); --border-strong:rgba(148,170,200,.32);
  --text:#e8eef7; --muted:#93a1b5; --faint:#5d6b80; --grid:rgba(148,170,200,.05);
  --ok:#34d399; --warn:#fbbf24; --err:#f87171; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f2f5fa; --bg-2:#e8edf5; --panel:rgba(255,255,255,.82); --panel-solid:#ffffff;
  --border:rgba(15,30,55,.12); --border-strong:rgba(15,30,55,.3);
  --text:#0e1726; --muted:#5a6a80; --faint:#8a97a8; --grid:rgba(15,30,55,.05);
  --ok:#059669; --warn:#d97706; --err:#dc2626; --shadow:0 10px 30px rgba(30,50,90,.12);
}
html[data-density="compact"]{--u:.72}
/* ============ RESET / FOUNDATION ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);font-size:14px;color:var(--text);background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:42px 42px; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3{line-height:1.25}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)} .small{font-size:11.5px}
.ic{display:inline-grid;place-items:center;flex:none}
.ic svg{display:block}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--accent);color:#06121c;padding:8px 14px;border-radius:0 0 10px 0;font-weight:600;text-decoration:none}
.skip:focus{left:0}
/* ============ LAYOUT / SHELL ============ */
#app{display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(10px);flex:none;z-index:70}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-logo{width:28px;height:28px;border-radius:8px}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:12.5px;letter-spacing:.14em}
.brand-text span{font-size:10px}
.crumbs{flex:1;display:flex;gap:8px;align-items:center;font-size:11.5px;min-width:0;overflow:hidden;color:var(--muted);white-space:nowrap}
.crumb-sep{color:var(--faint)}
.top-actions{display:flex;gap:8px;align-items:center}
.search-btn{display:flex;gap:8px;align-items:center;padding:7px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);color:var(--muted);cursor:pointer;font-size:12.5px}
.search-btn:hover{border-color:var(--border-strong);color:var(--text)}
.kbd{padding:1px 6px;border:1px solid var(--border);border-radius:6px;font-size:10px;font-family:var(--font-mono);color:var(--faint)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7c5cff);color:#06121c;font-weight:700;font-size:11px;flex:none}
.shell{display:flex;flex:1;min-height:0}
.sidebar{width:236px;flex:none;border-right:1px solid var(--border);padding:10px;display:flex;flex-direction:column;overflow:auto;background:var(--bg)}
.side-group{display:flex;flex-direction:column}
.side-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 8px 6px}
.side-item{display:flex;gap:10px;align-items:center;padding:calc(8px*var(--u)) 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13px}
.side-item:hover{background:var(--bg-2);color:var(--text)}
.side-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;padding:12px 10px;color:var(--faint);font-size:10.5px;border-top:1px solid var(--border)}
.scrim{display:none}
.main{flex:1;overflow:auto;padding:18px;min-width:0}
#outlet{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.statusbar{display:flex;gap:14px;align-items:center;height:32px;padding:0 12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);background:var(--bg);flex:none}
.sb-spacer{flex:1}
.sb-chip{display:inline-flex;gap:6px;align-items:center}
/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;transition:opacity .45s}
#boot.done{opacity:0;pointer-events:none}
.boot-card{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(430px,92vw)}
.boot-logo{width:74px;height:74px;border-radius:18px;box-shadow:0 0 46px var(--accent-soft)}
.boot-title{font-size:22px;letter-spacing:.22em;font-weight:700}
.boot-title span{color:var(--accent)}
.boot-tag{color:var(--muted);font-size:12px;margin-top:-4px}
.boot-bar{width:100%;height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px}
.boot-fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.boot-log{width:100%;height:132px;overflow:auto;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.boot-line{display:flex;gap:8px;align-items:baseline}
.boot-t{color:var(--faint)}
.boot-ok{color:var(--ok);margin-left:auto}
.boot-err{color:var(--err);margin-left:auto}
/* ============ COMPONENTS ============ */
.page{display:flex;flex-direction:column;gap:16px;animation:fadeUp .35s ease}
.page.narrow{max-width:880px;margin:0 auto;width:100%}
.page.center{display:grid;place-items:center;min-height:56vh}
.page-head{display:flex;flex-direction:column;gap:5px}
.page-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.page-title .ic{color:var(--accent)}
.page-sub{color:var(--muted);font-size:12.5px;max-width:680px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);backdrop-filter:blur(8px)}
.card-head{display:flex;align-items:center;gap:8px;padding:calc(12px*var(--u)) calc(16px*var(--u));border-bottom:1px solid var(--border)}
.card-ic{color:var(--accent);display:grid;place-items:center}
.card-title{font-weight:600;font-size:12.5px;letter-spacing:.02em}
.head-extra{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-pad{padding:calc(16px*var(--u))}
.card-foot{padding:9px 16px;border-top:1px solid var(--border)}
.stat{padding:14px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--border);display:flex;flex-direction:column;gap:2px;position:relative;backdrop-filter:blur(8px)}
.stat-value{font-size:22px;font-weight:700;font-family:var(--font-mono)}
.stat-label{color:var(--muted);font-size:11.5px}
.stat-icon{position:absolute;top:12px;right:12px;color:var(--accent)}
.rows{padding:6px 0}
.row{display:flex;align-items:center;gap:10px;padding:calc(8px*var(--u)) calc(16px*var(--u))}
.row-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row-text{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-text em{font-style:normal;color:var(--accent)}
.row-ic{color:var(--accent);display:grid;place-items:center;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:var(--panel-solid);font-size:11px;color:var(--muted)}
.chip.small{padding:2px 7px;font-size:10px}
.chip-accent{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.chiprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:6px;background:var(--bg-2);border:1px solid var(--border);font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.tag.st-stable{color:var(--ok)} .tag.st-beta{color:var(--warn)} .tag.st-experimental{color:var(--accent)}
.hero-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel-solid);color:var(--text);cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);border-color:transparent;color:#06121c;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}
.qa{display:flex;gap:10px;flex-wrap:wrap}
.qa.end{justify-content:flex-end}
.empty{padding:36px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-align:center}
.error-card{padding:30px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:440px}
.error-card .ic{color:var(--err)}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.page-loading{display:flex;gap:10px;align-items:center;justify-content:center;padding:70px}
.meta-row{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px dashed var(--border);font-size:12px;align-items:baseline}
.meta-row:last-child{border-bottom:none}
.bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 16px}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}
/* hero */
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);min-height:200px;display:flex;align-items:flex-end}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,14,.12),rgba(4,8,14,.86))}
.hero-content{position:relative;padding:22px;display:flex;flex-direction:column;gap:8px;color:#f2f7ff}
.hero-content h1{font-size:24px;letter-spacing:-.01em}
.hero-content p{color:#b9c6da;font-size:12.5px}
/* explorer */
.explorer{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.tree{padding:8px;max-height:560px;overflow:auto}
.tree-node{padding-left:10px}
.tree summary{display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--muted);list-style:none;font-size:12.5px}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--bg-2);color:var(--text)}
.tree-folder[open]>summary{color:var(--text)}
.tree-file{display:flex;gap:6px;align-items:center;width:100%;padding:6px 8px;border:none;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;font-size:12px;text-align:left}
.tree-file:hover{background:var(--bg-2);color:var(--text)}
.tree-file.active{background:var(--accent-soft);color:var(--accent)}
.viewer{display:flex;flex-direction:column;gap:14px;min-width:0}
.viewer-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pre{font-family:var(--font-mono);font-size:11.5px;line-height:1.6;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;max-height:460px;white-space:pre;color:var(--text)}
/* docs */
.doc-card{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:16px;transition:transform .15s,border-color .15s}
.doc-card:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.doc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.doc-head{display:flex;flex-direction:column;gap:10px}
.doc-meta{display:flex;gap:6px;flex-wrap:wrap}
/* assets */
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.input,.select{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font:inherit;font-size:13px}
.input{flex:1;min-width:200px}
.input:focus,.select:focus{border-color:var(--accent);outline:none}
.asset-card{cursor:pointer;overflow:hidden;text-align:left;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.asset-card:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.asset-thumb{height:120px;overflow:hidden;background:var(--bg-2)}
.cover-img{width:100%;height:100%;object-fit:cover;display:block}
.asset-body{padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.asset-id{font-size:12px;font-weight:600}
.cat-card{cursor:pointer;overflow:hidden;text-align:left;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);transition:transform .15s,border-color .15s}
.cat-card:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.cat-cover{height:110px;overflow:hidden;background:var(--bg-2)}
.cat-cover.tile{display:grid;place-items:center;color:var(--accent)}
.cat-body{padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cat-name{font-size:12.5px;font-weight:600}
/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(12px*var(--u)) calc(16px*var(--u));border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-info{display:flex;flex-direction:column;gap:2px;font-size:13px}
.switch{position:relative;width:40px;height:22px;display:inline-block;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.knob{position:absolute;inset:0;background:var(--border-strong);border-radius:99px;transition:.2s;pointer-events:none}
.knob::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked+.knob{background:var(--accent)}
.switch input:checked+.knob::after{left:21px}
.switch input:focus-visible+.knob{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:4px;background:var(--bg-2);padding:4px;border-radius:10px;border:1px solid var(--border)}
.seg-btn{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:7px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;text-transform:capitalize}
.seg-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sw{width:10px;height:10px;border-radius:50%}
.sw-cyan{background:#22d3ee}.sw-violet{background:#a78bfa}.sw-emerald{background:#34d399}.sw-amber{background:#fbbf24}
/* system */
.layers{padding:12px 18px;position:relative}
.layers::before{content:'';position:absolute;left:21.5px;top:20px;bottom:20px;width:1px;background:var(--border-strong)}
.layer{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:11.5px}
.layer-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-soft);flex:none}
.logs{max-height:280px;overflow:auto;padding:8px}
.log{display:grid;grid-template-columns:70px 86px 1fr;gap:8px;padding:3px 8px;font-size:10.5px;align-items:baseline}
.log-t{color:var(--faint)} .log-s{color:var(--accent)}
.lv-error .log-m{color:var(--err)} .lv-warn .log-m{color:var(--warn)} .lv-debug .log-m{color:var(--muted)}
.rights{display:flex;gap:8px;align-items:center;padding:6px 2px}
/* prose (rendered markdown) */
.prose{line-height:1.7;font-size:13.5px}
.prose h1{font-size:1.5rem;margin:1em 0 .5em}
.prose h2{font-size:1.2rem;margin:1.2em 0 .5em}
.prose h3{font-size:1.05rem;margin:1em 0 .4em}
.prose p{margin:.7em 0}
.prose ul,.prose ol{padding-left:1.3em;margin:.7em 0}
.prose li{margin:.3em 0}
.prose code{font-family:var(--font-mono);font-size:.85em;background:var(--bg-2);border:1px solid var(--border);padding:2px 6px;border-radius:6px}
.prose pre{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto;margin:.9em 0}
.prose pre code{background:none;border:none;padding:0}
.prose blockquote{border-left:3px solid var(--accent);padding:6px 14px;color:var(--muted);margin:.9em 0;background:var(--accent-soft);border-radius:0 8px 8px 0}
.prose table{border-collapse:collapse;width:100%;margin:.9em 0;font-size:12.5px}
.prose th,.prose td{border:1px solid var(--border);padding:7px 10px;text-align:left}
.prose th{background:var(--bg-2)}
.prose a{color:var(--accent)}
.prose hr{border:none;border-top:1px solid var(--border);margin:1.2em 0}
/* palette */
.palette-back{position:fixed;inset:0;background:rgba(4,8,14,.55);backdrop-filter:blur(4px);z-index:90;display:flex;justify-content:center;align-items:flex-start;padding-top:13vh;opacity:0;transition:opacity .18s}
.palette-back.in{opacity:1}
.palette{width:min(620px,92vw);background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;transform:translateY(8px);transition:transform .18s}
.palette-back.in .palette{transform:none}
.palette-input-row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);color:var(--muted)}
#palette-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:inherit;font-size:14px}
.pal-list{max-height:330px;overflow:auto;padding:6px}
.pal-group{padding:9px 10px 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pal-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--muted);cursor:pointer;font-size:13px}
.pal-item.sel{background:var(--accent-soft);color:var(--text)}
.pal-item .ic{color:var(--accent)}
.pal-hint{padding:8px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--faint)}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(4,8,14,.55);backdrop-filter:blur(4px);z-index:92;display:grid;place-items:center;opacity:0;transition:opacity .18s}
.modal-back.in{opacity:1}
.modal{width:min(560px,92vw);max-height:84vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.modal-pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:13px}
.modal-cover{height:190px;border-radius:10px;overflow:hidden;background:var(--bg-2)}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* toasts */
#toasts{position:fixed;right:16px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:95}
.toast{display:flex;gap:10px;align-items:center;background:var(--panel-solid);border:1px solid var(--border-strong);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);animation:toastIn .25s ease;font-size:12.5px;max-width:340px}
.toast .ic{color:var(--accent)}
.toast.t-success .ic{color:var(--ok)}
.toast.t-error .ic{color:var(--err)}
.toast.out{opacity:0;transform:translateY(6px);transition:.25s}
/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* responsive */
@media(max-width:1060px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.explorer{grid-template-columns:1fr}}
@media(max-width:920px){
  .sidebar{position:fixed;left:0;top:56px;bottom:32px;transform:translateX(-102%);transition:transform .25s;z-index:60;background:var(--bg)}
  body.sidebar-open .sidebar{transform:none}
  .scrim{display:block;position:fixed;left:0;right:0;top:56px;bottom:32px;background:rgba(0,0,0,.45);z-index:55;opacity:0;pointer-events:none;transition:.2s}
  body.sidebar-open .scrim{opacity:1;pointer-events:auto}
  .crumbs{display:none}
}
@media(max-width:640px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  #search-label,.search-btn .kbd{display:none}
  #sb-cache{display:none}
  .main{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
