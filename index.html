<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Skybox Cube Parallax - Vanilla JS</title>
    <style>
        /* --- CSS RESET & CẤU HÌNH NỀN --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* --- KHÔNG GIAN 3D (PERSPECTIVE) --- */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 400px; /* Tạo độ sâu trường ảnh 3D */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective-origin: center;
        }

        /* --- KHỐI LẬP PHƯƠNG SKYBOX --- */
        .cube {
            width: 1000px; /* Kích thước cạnh hộp lớn hơn màn hình để bao bọc góc nhìn */
            height: 1000px;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
            /* Cấu hình mặc định ban đầu */
            transform: translateZ(200px) rotateX(0deg) rotateY(0deg); 
        }

        /* --- ĐỊNH DẠNG CHUNG CHO 6 MẶT --- */
        .face {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background-size: cover;
            background-position: center;
            backface-visibility: hidden; /* Ẩn mặt sau để tối ưu hiệu năng */
            box-shadow: 0 0 2px rgba(0,0,0,0.5); /* Giảm đường nứt giữa các cạnh */
        }

        /* --- ĐỊNH VỊ 6 MẶT TRONG KHÔNG GIAN 3D --- */
        /* Sử dụng ảnh phong cảnh chất lượng cao từ Unsplash làm hình nền */
        .front  { 
            transform: rotateY(  0deg) translateZ(-500px); 
            background-image: url('https://unsplash.com'); 
        }
        .back   { 
            transform: rotateY(180deg) translateZ(-500px); 
            background-image: url('https://unsplash.com'); 
        }
        .right  { 
            transform: rotateY( 90deg) translateZ(-500px); 
            background-image: url('https://unsplash.com'); 
        }
        .left   { 
            transform: rotateY(-90deg) translateZ(-500px); 
            background-image: url('https://unsplash.com'); 
        }
        .top    { 
            transform: rotateX( 90deg) translateZ(-500px); 
            background-image: url('https://unsplash.com'); 
        }
        .bottom { 
            transform: rotateX(-90deg) translateZ(-500px); 
            background-image: url('https://unsplash.com'); 
        }

        /* --- GIAO DIỆN CHỮ ĐÈ LÊN TRÊN --- */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none; /* Cho phép vuốt xuyên qua chữ để xoay 3D */
            z-index: 10;
        }
        .overlay h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .overlay p {
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Khung nhìn 3D -->
    <div class="scene">
        <!-- Khối lập phương đóng vai trò bầu trời bao quanh -->
        <div class="cube" id="skybox">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <!-- Nội dung hiển thị phía trước -->
    <div class="overlay">
        <h1>VANILLA 3D SKYBOX</h1>
        <p>Vuốt màn hình điện thoại để trải nghiệm Parallax</p>
    </div>

    <!-- --- JAVASCRIPT XỬ LÝ SỰ KIỆN VUỐT/DI CHUỘT MÀN HÌNH --- -->
    <script>
        const cube = document.getElementById('skybox');
        
        // Cấu hình độ nhạy của hiệu ứng ứng với cử chỉ vuốt
        const sensitivity = 0.15; 
        
        let currentX = 0; // Góc xoay X hiện tại
        let currentY = 0; // Góc xoay Y hiện tại
        
        let startX = 0;   // Toạ độ điểm chạm/chuột đầu tiên
        let startY = 0;
        let isDragging = false;

        // --- XỬ LÝ TRÊN ĐIỆN THOẠI (TOUCH EVENTS) ---
        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            // Tính toán khoảng cách đã vuốt
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;
            
            // Cập nhật tọa độ mốc mới
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            
            // Tính toán góc xoay mới (Vuốt ngang đổi góc Y, vuốt dọc đổi góc X)
            currentY += deltaX * sensitivity;
            currentX -= deltaY * sensitivity;
            
            // Giới hạn góc ngước lên/nhìn xuống để tránh lật ngược camera
            currentX = Math.max(-85, Math.min(85, currentX));
            
            // Thực hiện xoay khối hộp 3D trong không gian
            cube.style.transform = `translateZ(350px) rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        // --- XỬ LÝ TRÊN MÁY TÍNH (MOUSE EVENTS - ĐỂ KIỂM TRA) ---
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            startX = e.clientX;
            startY = e.clientY;
            
            currentY += deltaX * sensitivity;
            currentX -= deltaY * sensitivity;
            currentX = Math.max(-85, Math.min(85, currentX));
            
            cube.style.transform = `translateZ(350px) rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
