<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Personal Portfolio VR Platform</title>
    <link rel="stylesheet" href="styles/base/reset.css">
    <link rel="stylesheet" href="styles/base/variables.css">
    <link rel="stylesheet" href="styles/layout/viewport.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: var(--font-primary, sans-serif);
        }
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            color: #ffffff;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="app-loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; letter-spacing: 2px; font-size: 14px;">INITIALIZING VR SPACE...</p>
    </div>

    <div id="vr-viewport" class="vr-viewport">
        <div id="vr-scene-root" class="vr-scene-root">
            <vr-skybox></vr-skybox>
            <div class="vr-content-layer">
                <vr-panel id="main-portfolio-panel">
                    <vr-card type="profile" title="Developer Profile"></vr-card>
                    <vr-card type="projects" title="Featured Projects"></vr-card>
                </vr-panel>
            </div>
        </div>
    </div>

    <div id="ui-overlay-layer">
        <vr-settings></vr-settings>
        <vr-modal id="global-detail-modal"></vr-modal>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
