<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Nền tròn tối giản -->
  <circle cx="250" cy="250" r="220" fill="#E6EEF8" stroke="#4A5568" stroke-width="8"/>
  
  <!-- Nhóm hình tượng Kobayashi -->
  <g id="kobayashi-silhouette">
    <!-- Tóc đuôi ngựa phía sau -->
    <path d="M 190 280 C 160 290, 140 330, 150 360 C 165 350, 180 310, 190 290 Z" fill="#D65A5A" />
    <circle cx="185" cy="285" r="10" fill="#4A5568" /> <!-- Dây buộc tóc -->

    <!-- Cổ và Khuôn mặt -->
    <path d="M 210 250 C 210 180, 310 180, 310 250 C 310 300, 270 330, 250 330 C 230 330, 210 300, 210 250 Z" fill="#FFF0E5" />
    
    <!-- Mái tóc đặc trưng (Tóc mái và hai bên) -->
    <path d="M 205 240 C 205 170, 315 170, 315 240 C 315 210, 300 180, 260 180 C 220 180, 205 210, 205 240 Z" fill="#D65A5A" />
    <!-- Tóc mái chéo che trán -->
    <path d="M 210 210 Q 240 230 260 210 Q 285 245 305 215 Q 315 250 315 260 C 300 240, 220 240, 210 210 Z" fill="#D65A5A" />
    
    <!-- Kính cận thương hiệu -->
    <g id="glasses" stroke="#4A5568" stroke-width="6" fill="none">
      <!-- Mắt kính trái -->
      <rect x="220" y="235" width="35" height="25" rx="5" />
      <!-- Mắt kính phải -->
      <rect x="265" y="235" width="35" height="25" rx="5" />
      <!-- Cầu kính -->
      <line x1="255" y1="245" x2="265" y2="245" />
      <!-- Gọng kính hai bên -->
      <line x1="220" y1="245" x2="210" y2="243" />
      <line x1="300" y1="245" x2="310" y2="243" />
    </g>

    <!-- Mắt lờ đờ đặc trưng (Vẽ đơn giản hợp phong cách logo) -->
    <g id="eyes" stroke="#4A5568" stroke-width="4" stroke-linecap="round">
      <line x1="230" y1="247" x2="245" y2="247" />
      <line x1="275" y1="247" x2="290" y2="247" />
    </g>

    <!-- Áo sơ mi công sở phía dưới -->
    <path d="M 190 400 L 310 400 L 290 350 L 210 350 Z" fill="#FFFFFF" stroke="#4A5568" stroke-width="5" />
    <!-- Cổ áo chữ V -->
    <path d="M 230 350 L 250 380 L 270 350" fill="none" stroke="#4A5568" stroke-width="5" />
    <!-- Cà vạt thanh lịch -->
    <path d="M 245 380 L 255 380 L 260 420 L 250 430 L 240 420 Z" fill="#5A77D6" />
  </g>
</svg>
 
